<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日工作追蹤</title>
<meta http-equiv="refresh" content="0; url=https://script.google.com/macros/s/AKfycbwKzMAXKRRg7qaqtp4NLh76b9BRY0NK8VFE6akSqM6GDbtQswHnj6fhPP10ma8_zaQSxA/exec">
<style>
  :root{--bg:#F1F1F3;--ink:#1C1B2E;--muted:#6C6B80;--blue:#2D5BE3}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;padding:16px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #E1E1E8;border-radius:10px;overflow:hidden;max-width:380px;width:100%;text-align:center}
  .bar{height:6px;background:linear-gradient(90deg,#2D5BE3,#5B97F5 22%,#8A55D6 45%,#E0508A 68%,#E0791F 86%,#C98A00)}
  .in{padding:28px 24px}
  h1{font-size:20px;margin:0 0 8px} p{color:var(--muted);margin:0 0 18px;font-size:14.5px}
  a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:10px 20px;border-radius:5px;font-weight:600}
</style>
</head>
<body>
<div class="card"><div class="bar"></div><div class="in">
  <h1>每日工作追蹤</h1>
  <p>正在前往系統…</p>
  <a id="go" href="https://script.google.com/macros/s/AKfycbwKzMAXKRRg7qaqtp4NLh76b9BRY0NK8VFE6akSqM6GDbtQswHnj6fhPP10ma8_zaQSxA/exec">沒有自動跳轉請點這裡</a>
</div></div>
<script>location.replace(document.getElementById('go').href);</script>
</body>
</html>
