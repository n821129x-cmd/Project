<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日工作追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1F3; --panel:#FFFFFF; --line:#E1E1E8; --line-2:#D2D2DC;
  --ink:#1C1B2E; --muted:#6C6B80; --faint:#9A99AB;
  --blue:#2D5BE3; --blue-2:#5B97F5; --blue-soft:#ECF1FE;
  --purple:#8A55D6; --purple-soft:#F6EFFD; --purple-line:#E6D2F8; --purple-badge:#E4C8F8; --purple-ink:#3B1E63;
  --pink:#E0508A; --pink-soft:#FDEDF4;
  --teal:#14917F; --teal-soft:#E3F5F1;
  --orange:#E0791F; --orange-soft:#FDF1E5;
  --amber:#C98A00; --amber-ink:#8A5E00; --amber-soft:#FFF5D6;
  --gray-soft:#F2F2F5; --track:#E4E4EC;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.busy button{pointer-events:none;opacity:.6}

/* 頂部 */
.demo{background:var(--purple-soft);border-bottom:1px solid var(--purple-line);color:var(--purple-ink);font-size:13.5px;text-align:center;padding:7px 16px}
.rainbow{height:5px;background:linear-gradient(90deg,#2D5BE3 0%,#5B97F5 22%,#8A55D6 45%,#E0508A 68%,#E0791F 86%,#C98A00 100%)}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:18px 28px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px}
.mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2D5BE3,#8A55D6 60%,#E0508A);color:#fff;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 6px 4px 4px;font-size:14px;cursor:pointer}
.who:hover{border-color:var(--blue-2)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12.5px;font-weight:700;flex:none}
.role{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.role.mgr{background:var(--purple-badge);color:var(--purple-ink)}
.tabs{display:flex;gap:12px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:10px;padding:13px 22px;font-size:16.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px}
.tab.on{background:var(--bg)}
.tab.accent:not(.on){background:var(--purple-soft);border-color:var(--purple-line);box-shadow:0 -3px 16px rgba(138,85,214,.14)}
.tab svg{width:21px;height:21px}
.tab .ic{color:var(--blue)} .tab .ic.p{color:var(--purple)} .tab .ic.k{color:var(--pink)} .tab .ic.t{color:var(--teal)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px;background:var(--purple-badge);color:var(--purple-ink);letter-spacing:.03em}

/* 版面 */
.wrap{max-width:1320px;margin:0 auto;padding:30px 28px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}
.wrap.single{grid-template-columns:minmax(0,1fr)}
.side .search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 14px}
.side .search input{border:none;outline:none;flex:1;background:transparent;min-width:0}
.side h4{display:flex;align-items:center;gap:8px;margin:24px 0 11px;font-size:16px}
.side h4 svg{width:18px;height:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:14.5px;cursor:pointer;line-height:1.4;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--blue-2)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill .n{color:var(--faint);font-size:12.5px}
.pill.on .n{color:rgba(255,255,255,.82)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.panel{background:#fff;border:1px solid var(--line);border-radius:3px;padding:28px 32px}
.panel+.panel{margin-top:24px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel h2{margin:0;font-size:21px}
.head-acts{display:flex;gap:10px;flex-wrap:wrap}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}

/* 彩色統計磚 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0 6px}
.tile{border-radius:6px;padding:12px 14px;border:1px solid transparent}
.tile .k{font-size:13px;font-weight:600}
.tile .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:2px;color:var(--ink)}
.tile .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.tile.c-blue{background:var(--blue-soft);border-color:#D6E1FC} .tile.c-blue .k{color:var(--blue)}
.tile.c-purple{background:var(--purple-soft);border-color:var(--purple-line)} .tile.c-purple .k{color:var(--purple)}
.tile.c-pink{background:var(--pink-soft);border-color:#F8D3E3} .tile.c-pink .k{color:#C23A72}
.tile.c-teal{background:var(--teal-soft);border-color:#C6EAE2} .tile.c-teal .k{color:#0E7466}
.tile.c-amber{background:var(--amber-soft);border-color:#F5E2A8} .tile.c-amber .k{color:var(--amber-ink)}
.tile.c-orange{background:var(--orange-soft);border-color:#F8DCC0} .tile.c-orange .k{color:#B85E10}

.sec-title{font-size:16.5px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title .sw{width:12px;height:12px;border-radius:3px}
.sec-title .cnt{font-size:12.5px;color:var(--muted);background:var(--gray-soft);border-radius:999px;padding:1px 9px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:16px}

/* 卡片 */
.card{border:1px solid var(--line);border-radius:4px;background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;overflow:hidden;border-top:4px solid var(--pc,#2D5BE3)}
.card:hover{box-shadow:0 6px 18px rgba(28,27,46,.10);transform:translateY(-1px)}
.viz{padding:13px 16px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--pct,#F5F8FF),#fff)}
.viz-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.big{font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--blue);line-height:1.1}
.big.todo{color:var(--faint)} .big.done{color:var(--teal)} .big.wait{color:var(--purple)} .big.pause{color:var(--orange)} .big.review{color:var(--amber)} .big.od{color:var(--pink)}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-todo{background:var(--gray-soft);color:var(--muted)}
.st-doing{background:var(--blue-soft);color:var(--blue)}
.st-wait{background:var(--purple-soft);color:var(--purple)}
.st-pause{background:var(--orange-soft);color:#B85E10}
.st-review{background:var(--amber-soft);color:var(--amber-ink)}
.st-done{background:var(--teal-soft);color:#0E7466}
.st-od{background:var(--pink-soft);color:#C23A72}
.bar{height:8px;border-radius:4px;background:#fff;margin-top:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--track)}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.bar.done i{background:linear-gradient(90deg,#14917F,#3CC2A8)}
.tbar{height:3px;background:var(--track);margin-top:9px;border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--purple)}
.tbar.od i{background:var(--pink)} .tbar.done i{background:var(--teal)}
.viz-sub{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;gap:8px}
.viz-sub .od{color:#C23A72;font-weight:600}
.body{padding:12px 16px 6px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ptag{font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:4px}
.stag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--orange-soft);color:#B85E10}
.content{font-weight:600;margin-top:6px}
.latest{font-size:13.5px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--faint);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .av{width:20px;height:20px;font-size:10.5px}
.acts{display:flex;gap:8px;padding:8px 16px 14px;flex-wrap:wrap}
.wait-note{font-size:12.5px;color:var(--amber-ink);background:var(--amber-soft);border-radius:4px;padding:4px 10px}

/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--blue-2)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#2450CF}
.btn.purple{background:var(--purple-soft);border-color:var(--purple-line);color:var(--purple-ink)}
.btn.teal{background:var(--teal-soft);border-color:#BFE6DF;color:#0E6F63}
.btn.amber{background:var(--amber-soft);border-color:#F2DC9E;color:var(--amber-ink)}
.btn.pink{background:var(--pink-soft);border-color:#F6CFE0;color:#B32F66}
.btn.danger{background:#D63B6F;border-color:#D63B6F;color:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin-top:22px}
.d-body .form-grid{margin-top:0}
.full{grid-column:1/-1}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.field label .opt{font-weight:400;color:var(--faint);font-size:12.5px;margin-left:6px}
.inp{width:100%;border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea.inp{resize:vertical;min-height:84px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}

/* 統計圖表 */
.filters{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:18px}
.filters .lbl{font-size:13px;color:var(--muted);font-weight:600;margin-right:4px}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:22px}
.ringbox{border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;gap:18px;align-items:center}
.ringbox.proj{border-top:4px solid var(--blue)} .ringbox.temp{border-top:4px solid var(--pink)}
.ring{width:132px;height:132px;flex:none}
.ring .n{font-size:27px;font-weight:700;fill:var(--ink)}
.ring .s{font-size:12px;fill:var(--muted)}
.ringbox h3{margin:0 0 8px;font-size:16px}
.rlist{font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.rlist b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rows{display:grid;gap:12px;margin-top:12px}
.row{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 150px;gap:14px;align-items:center}
.row .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm .sw{width:10px;height:10px;border-radius:3px;flex:none}
.sbar{display:flex;gap:2px;height:16px}
.sbar i{display:block;min-width:4px}
.sbar i:first-child{border-radius:4px 0 0 4px} .sbar i:last-child{border-radius:0 4px 4px 0} .sbar i:only-child{border-radius:4px}
.row .num{font-size:13.5px;color:var(--muted);text-align:right;white-space:nowrap}
.row .num b{color:var(--ink);font-size:15px}
.row .num .odn{color:#C23A72;font-weight:600;margin-left:6px}
details.tbl{margin-top:16px}
details.tbl summary{cursor:pointer;color:var(--blue);font-size:13.5px;font-weight:600}
table.data{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:10px}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--muted);font-weight:600;background:var(--gray-soft)}
#tip{position:fixed;pointer-events:none;background:#1C1B2E;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:4px;z-index:70;white-space:nowrap;display:none}

/* 視窗 */
.overlay{position:fixed;inset:0;background:rgba(28,27,46,.38);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:#fff;border-radius:8px;width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(28,27,46,.25);border-top:5px solid var(--dc,#2D5BE3)}
.dialog.wide{max-width:680px}
.d-head{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-head h3{margin:0;font-size:18px}
.d-head .sub{font-size:13px;color:var(--muted);margin-top:3px}
.x{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--faint);padding:2px 6px}
.d-body{padding:18px 24px}
.d-foot{padding:0 24px 22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.d-foot .left{margin-right:auto}
.prog-row{display:flex;align-items:center;gap:14px}
.prog-row input[type=range]{flex:1;accent-color:var(--blue)}
.prog-val{font-weight:700;color:var(--blue);min-width:48px;text-align:right}
.report-text{width:100%;min-height:320px;font-size:14px;line-height:1.75;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.hist h4{margin:0 0 10px;font-size:14.5px}
.h-item{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.h-item .t{color:var(--faint)}
.h-item .src{font-size:11.5px;color:var(--purple);background:var(--purple-soft);border-radius:3px;padding:0 6px;margin-left:6px}
.names{display:flex;flex-wrap:wrap;gap:10px}
.names .pill{padding:6px 14px 6px 6px;font-size:15px}
.note{font-size:13.5px;color:var(--muted);background:var(--gray-soft);border-radius:4px;padding:10px 12px;margin-bottom:14px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--blue);color:#fff;font-weight:700;padding:12px 20px;border-radius:6px;box-shadow:0 8px 24px rgba(45,91,227,.3);z-index:60;max-width:calc(100vw - 48px)}
.toast.err{background:#D63B6F}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.prev tr.skip td{color:var(--faint);background:#FAFAFC}
.vt{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:#fff;align-self:center}
.vt button{border:none;background:#fff;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.vt button svg{width:16px;height:16px}
.vt button.on{background:var(--blue);color:#fff}
.vt button+button{border-left:1px solid var(--line-2)}
.tl{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.tl-h,.tl-r{display:grid;grid-template-columns:minmax(0,1fr) 110px 120px 110px 96px 236px;gap:14px;align-items:center;padding:10px 14px}
.tl.nowho .tl-h,.tl.nowho .tl-r{grid-template-columns:minmax(0,1fr) 120px 110px 96px 236px}
.tl-h{background:var(--gray-soft);color:var(--muted);font-size:12.5px;font-weight:600}
.tl-r{border-top:1px solid var(--line);cursor:pointer;border-left:4px solid var(--pc);transition:background .12s}
.tl-r:hover{background:#FAFBFF}
.tl-title{font-weight:600;margin-top:3px}
.tl-latest{font-size:13px;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tl-id{font-size:11.5px;color:var(--faint)}
.tl-who{display:flex;align-items:center;gap:6px;font-size:13.5px}
.tl-who .av{width:22px;height:22px;font-size:11px}
.tl-st{display:flex;gap:4px;flex-wrap:wrap}
.tl-pg{display:flex;align-items:center;gap:6px}
.tl-pg .bar{flex:1;height:6px}
.tl-pg small{font-size:12px;color:var(--muted);min-width:30px}
.tl-due{font-size:13px;display:flex;flex-direction:column}
.tl-due small{font-size:11.5px;color:var(--muted)}
.tl-due small.od,.tl-due.od{color:#C23A72;font-weight:600}
.tl-acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
@media (max-width:860px){
  .vt span{display:none}
  .who-row{gap:5px} .who-row .lbl{display:none} .who>span:not(.av):not(.role){display:none}
  .brand{font-size:17px} .who-row .out{padding:5px 9px}
  .tl-h{display:none}
  .tl-r,.tl.nowho .tl-r{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px}
  .tl-main{grid-column:1/-1}
  .tl-who,.tl-st,.tl-pg,.tl-due{font-size:12.5px}
  .tl-acts{grid-column:1/-1;justify-content:flex-start}
}
.mail-steps{margin:14px 0 0;padding-left:20px;font-size:14px;line-height:1.9}
.mail-prev{margin-top:14px;border:1px solid var(--line);border-radius:6px;max-height:280px;overflow:auto;transform-origin:top left}
.d-foot a.btn{text-decoration:none}
.who-pill{padding:3px 11px 3px 3px}
.who-pill .av{width:22px;height:22px;font-size:11px}
.who-pill.zero{opacity:.55}
.pz-help{margin:10px 0 8px;font-size:14px;color:var(--muted)}
.pz-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:12px}
.pz-legend span{display:inline-flex;align-items:center;gap:5px}
.pz-legend i{width:11px;height:13px;border-radius:50% 50% 50% 50%/45% 45% 55% 55%;display:inline-block}
.pz-legend .pz-tag{background:var(--gray-soft);border-radius:999px;padding:1px 9px}
.pz-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#8CCB70}
.pz-wrap canvas{display:block;width:100%;touch-action:none;cursor:pointer;outline:none}
.pz-loading{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.pz-card{position:absolute;width:230px;background:#fff;border-radius:10px;box-shadow:0 10px 30px rgba(28,27,46,.22);padding:10px 12px;font-size:13px;z-index:3}
.pz-card-h{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.pz-card-h .x{margin-left:auto;font-size:18px}

/* ═════════ 工具 ═════════ */
const $ = s => document.querySelector(s);

function parseT(s){ if(!s) return null; const d=new Date(String(s).split('/').join('-').replace(' ','T')); return isNaN(d)?null:d; }
function dOnly(s){ const d=parseT(String(s).slice(0,10)+'T00:00'); return d?d.getTime():NaN; }

function api(fn,...args){

function orderTasks(list){
  const key=t=>t.project?t.project:'\uffff';
  const first={};
  list.forEach(t=>{ const k=key(t), tm=(parseT(t.assignedAt)||0)*1; if(first[k]===undefined||tm<first[k]) first[k]=tm; });

    const ka=key(a), kb=key(b);

  const tags=[];
  if(t.status==='完成') tags.push('已完成');
  else if(t.status==='待確認') tags.push('已完成，待主管確認');
  else if(t.status==='等待外部') tags.push('等待外部'+(t.waitingFor?'：'+t.waitingFor:''));
  else if(t.status==='暫停') tags.push('暫停');
  if(isOverdue(t)) tags.push('逾期');
  if(tags.length) s+='（'+tags.join('，')+'）';
  return s+'。';
}
function buildReportText(list){
  const lines=[S.config.salutation||'今日工作進度報告如下：',''];
  orderTasks(list).forEach((t,i)=>{ lines.push((i+1)+'.'+reportLine(t)); if(t.link) lines.push(t.link); });
  return lines.join('\n');
}

function baseList(){
  let list=S.tasks;
  if(S.tab==='mine') list=list.filter(t=>t.assignee===S.me);
  if(S.tab==='team' && S.f.who!=='全部') list=list.filter(t=>t.assignee===S.f.who);
  if(S.f.type!=='全部') list=list.filter(t=>t.type===S.f.type);
  if(S.f.src!=='全部') list=list.filter(t=>t.source===S.f.src);
  return list;
}
function matchStatus(t,s){
  if(s==='全部') return true;
  if(s==='未完成') return t.status!=='完成';
  if(s==='逾期') return isOverdue(t);
  if(s==='近7天完成') return t.status==='完成' && !!t.doneAt && dayDiff(t.doneAt,S.today)<7;
  return t.status===s;
}
const F_DEFAULT={type:'全部',status:'未完成',who:'全部',src:'全部',q:''};
/* 篩選提示條：有任何非預設條件時顯示 */
function filterNote(shown){
  const f=S.f, chips=[];
  if(f.status!==F_DEFAULT.status) chips.push('狀態：'+f.status);
  if(f.type!=='全部') chips.push('類型：'+f.type);
  if(f.src!=='全部') chips.push('來源：'+f.src);
  if(S.tab==='team'&&f.who!=='全部') chips.push('承辦人：'+f.who);
  if(f.q.trim()) chips.push('搜尋：「'+f.q.trim()+'」');
  if(!chips.length) return '';
  const total=baseList().filter(t=>t.status!=='完成').length;
  const narrowed=f.type!=='全部'||f.src!=='全部'||(S.tab==='team'&&f.who!=='全部');
  return `<div class="fnote">🔍 目前已篩選 ${chips.map(c=>`<span class="fc">${esc(c)}</span>`).join('')}
    <span class="cnt2">顯示 ${shown} 件</span><button class="btn sm amber" data-act="clearF">清除篩選</button>
    ${narrowed?`<span class="sub2">上方統計數字也已套用類型／來源${S.tab==='team'?'／承辦人':''}篩選</span>`:''}</div>`;
}
function visible(){
  let list=baseList().filter(t=>matchStatus(t,S.f.status));
  const q=S.f.q.trim().toLowerCase();
  if(q) list=list.filter(t=>[t.id,t.project,t.content,t.latest,t.assignee,t.waitingFor].join(' ').toLowerCase().includes(q));
  return list;
}

const STATUS_DOT={'近7天完成':'#14917F','未開始':'#B8B8C6','進行中':'#2D5BE3','等待外部':'#8A55D6','暫停':'#E0791F','待確認':'#C98A00','逾期':'#E0508A','完成':'#14917F'};

`;

function tilesHtml(list){
  const open=list.filter(t=>t.status!=='完成');
  const doneWeek=list.filter(t=>t.status==='完成' && t.doneAt && dayDiff(t.doneAt,S.today)<7).length;
  const T=(cls,label,v,n)=>`<button class="tile ${cls} ${S.f.status===v?'on':''}" data-act="tileF" data-v="${v}" title="點一下篩選「${label}」"><div class="k">${label}</div><div class="v">${n}</div><div class="hint2">${S.f.status===v?'篩選中・再點一次取消':'點一下篩選'}</div></button>`;
  return `<div class="tiles">
    ${T('c-blue','未完成','未完成',open.length)}
    ${T('c-purple','等待外部','等待外部',open.filter(t=>t.status==='等待外部').length)}
    ${T('c-amber','待主管確認','待確認',open.filter(t=>t.status==='待確認').length)}
    ${T('c-pink','逾期','逾期',open.filter(isOverdue).length)}
    ${T('c-teal','近 7 天完成','近7天完成',doneWeek)}</div>`;
}

    ${g.person&&S.aiPerson[g.k]&&S.aiPerson[g.k].text?`<div class="ai-box person-ai"><div class="ai-tag">${SPARK} AI 摘要</div>${mdHtml(S.aiPerson[g.k].text)}</div>`:''}
    ${taskList(g.items,S.tab)}`).join('')}</section>`;

function cardActions(t,view){
  const mine=t.assignee===S.me, mgr=isMgr(S.me), acts=[];
  if(t.status==='完成') return acts;
  if(mgr){
    if(t.status==='待確認'){
      acts.push(`<button class="btn sm teal" data-act="confirm" data-id="${t.id}">✓ 確認完成</button>`);
      acts.push(`<button class="btn sm pink" data-act="reject" data-id="${t.id}">退回</button>`);
    } else {
      if(mine && t.status==='未開始') acts.push(`<button class="btn sm primary" data-act="start" data-id="${t.id}">▶ 開始</button>`);
      acts.push(`<button class="btn sm" data-act="report" data-id="${t.id}">回報</button>`);
      acts.push(`<button class="btn sm teal" data-act="mgrDone" data-id="${t.id}">完成</button>`);
    }
    if(view!=='mine') acts.push(`<button class="btn sm purple" data-act="reassign" data-id="${t.id}">轉派</button>`);
    return acts;
  }
  if(!mine) return acts;
  if(t.status==='待確認') return [`<span class="wait-note">已提報，等待主管確認</span>`];
  if(t.status==='未開始') acts.push(`<button class="btn sm primary" data-act="start" data-id="${t.id}">▶ 開始</button>`);
  acts.push(`<button class="btn sm" data-act="report" data-id="${t.id}">回報</button>`);
  acts.push(`<button class="btn sm amber" data-act="submit" data-id="${t.id}">提報完成</button>`);
  return acts;
}

}
function rowHtml(t,view,showWho){
  const od=isOverdue(t), cls=ST_CLASS[t.status]||'todo', pc=projColor(t), prog=hasProg(t);
  let due='—';
  if(t.status==='完成') due=md(t.doneAt)+' 完成';
  else if(t.status==='待確認') due=md(t.submittedAt)+' 提報';
  else if(t.due){ const d=dayDiff(S.today,t.due); due=md(t.due)+(d>0?`<small>剩 ${d} 天</small>`:(d===0?'<small>今天</small>':`<small class="od">逾期 ${-d} 天</small>`)); }
  const acts=cardActions(t,view);
  return `<div class="tl-r" data-act="detail" data-id="${t.id}" style="--pc:${pc}">
    <div class="tl-main"><div class="tags"><span class="ptag" style="background:${hexA(pc,.12)};color:${pc}">${t.project?esc(t.project):'臨時代辦'}</span>${t.source==='自行新增'?'<span class="stag">自行新增</span>':''}<span class="tl-id">#${t.id}</span></div>
      <div class="tl-title">${esc(t.content)}</div>${t.latest?`<div class="tl-latest">${esc(t.latest)}${t.status==='等待外部'&&t.waitingFor?'（等待：'+esc(t.waitingFor)+'）':''}</div>`:(t.status==='等待外部'&&t.waitingFor?`<div class="tl-latest">等待：${esc(t.waitingFor)}</div>`:'')}</div>
    ${showWho?`<div class="tl-who">${avatar(t.assignee)}<span>${esc(t.assignee)}</span></div>`:''}
    <div class="tl-st"><span class="chip st-${cls}">${t.status}</span>${od?'<span class="chip st-od">逾期</span>':''}${t.notifyDone&&isMgr(S.me)?'<span class="chip st-review" title="提報完成時寄信通知">🔔</span>':''}</div>
    <div class="tl-pg">${prog?`<div class="bar ${t.status==='完成'||t.status==='待確認'?'done':''}" style="margin:0"><i style="width:${t.progress}%"></i></div><small>${t.progress}%</small>`:'<small class="muted">—</small>'}</div>
    <div class="tl-due ${od?'od':''}">${due}</div>
    <div class="tl-acts">${acts.join('')}</div>
  </div>`;
}
function cardHtml(t,view){
  const od=isOverdue(t), prog=hasProg(t), cls=ST_CLASS[t.status]||'todo', pc=projColor(t);
  let big, bigCls=od?'od':cls;
  if(prog) big=t.progress+'%';
  else if(t.status==='完成') big='完成';
  else if(t.status==='待確認') big='待確認';
  else if(t.status==='未開始') big='待開始';
  else big=elapsed(t.startedAt)||'—';
  let runTxt;
  if(t.status==='未開始') runTxt='指派 '+elapsed(t.assignedAt);
  else if(t.status==='完成') runTxt='用時 '+(elapsed(t.startedAt||t.assignedAt,t.submittedAt||t.doneAt)||'—');
  else if(t.status==='待確認') runTxt='用時 '+(elapsed(t.startedAt||t.assignedAt,t.submittedAt)||'—');
  else runTxt='已進行 '+elapsed(t.startedAt);
  let remain='';
  if(t.status==='完成') remain=md(t.doneAt)+' 完成';
  else if(t.status==='待確認') remain=md(t.submittedAt)+' 提報';
  else if(t.due){ const d=dayDiff(S.today,t.due); remain = d>0?'剩 '+d+' 天':(d===0?'今天到期':`<span class="od">逾期 ${-d} 天</span>`); }
  const a=dOnly(t.assignedAt), e=dOnly(t.due)+864e5;
  const endT=(t.status==='完成'||t.status==='待確認')?((parseT(t.submittedAt||t.doneAt)||new Date()).getTime()):Date.now();
  const tp = e>a ? Math.max(3,Math.min(100,(endT-a)/(e-a)*100)) : 100;
  const acts=cardActions(t,view);
  const done=t.status==='完成'||t.status==='待確認';
  return `<article class="card" data-act="detail" data-id="${t.id}" style="--pc:${pc};--pct:${hexA(pc,.07)}">
    <div class="viz">
      <div class="viz-top"><span class="big ${bigCls}">${esc(big)}</span>
        <span class="chips">${t.notifyDone&&isMgr(S.me)?'<span class="chip st-review" title="員工提報完成時會寄信通知">🔔</span>':''}<span class="chip st-${cls}">${t.status}</span>${od?'<span class="chip st-od">逾期</span>':''}</span></div>
      ${prog?`<div class="bar ${done?'done':''}"><i style="width:${t.progress}%"></i></div>`:''}
      <div class="tbar ${od?'od':''} ${done?'done':''}" title="期限時間消耗"><i style="width:${tp}%"></i></div>
      <div class="viz-sub"><span>${esc(runTxt)}</span><span>${remain}</span></div>
    </div>
    <div class="body">
      <div class="tags"><span class="ptag" style="background:${hexA(pc,.12)};color:${pc}">${t.project?esc(t.project):'臨時代辦'}</span>${t.source==='自行新增'?'<span class="stag">自行新增</span>':''}</div>
      <div class="content">${esc(t.content)}</div>
      ${t.latest?`<div class="latest">${esc(t.latest)}${t.status==='等待外部'&&t.waitingFor?'（等待：'+esc(t.waitingFor)+'）':''}</div>`:(t.status==='等待外部'&&t.waitingFor?`<div class="latest">等待：${esc(t.waitingFor)}</div>`:'')}

function xlsxReady(){ if(window.XLSX) return true; toast('Excel 元件載入失敗，請重新整理後再試',true); return false; }
function downloadTemplate(kind){
  if(!xlsxReady()) return;
  const spec=IMPORT_SPEC[kind];
  const ws=XLSX.utils.aoa_to_sheet([spec.cols.map(c=>c[1]),...spec.sample]);
  ws['!cols']=spec.cols.map(c=>({wch:c[0]==='content'?36:14}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,spec.label);
  try{ XLSX.writeFile(wb,spec.label+'匯入範本.xlsx'); }
  catch(e){ toast('瀏覽器不允許下載，請自行建立 Excel，第一列放欄位名稱',true); }

function pad2(n){ return String(n).padStart(2,'0'); }
function normDate(v){
  if(v===''||v==null) return '';
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*864e5)); return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
  if(v instanceof Date) return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  const nums=String(v).match(/\d+/g)||[];
  let y,m,d;
  if(nums.length>=3){ y=+nums[0]; m=+nums[1]; d=+nums[2]; }
  else if(nums.length===2){ y=+S.today.slice(0,4); m=+nums[0]; d=+nums[1]; }
  else return '';
  if(y<1911) y+=1911;
  if(m<1||m>12||d<1||d>31) return '';
  return y+'-'+pad2(m)+'-'+pad2(d);
}
function parseSheet(kind,buf){
  const spec=IMPORT_SPEC[kind];
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const norm=x=>String(x).replace(/\s+/g,'').toLowerCase();
  let hIdx=-1, map=null;
  for(let i=0;i<Math.min(aoa.length,10);i++){
    const hdr=aoa[i].map(norm), m={};
    spec.cols.forEach(c=>{ const j=hdr.findIndex(h=>c[2].map(norm).includes(h)); if(j>=0) m[c[0]]=j; });
    if(spec.required.every(k=>k in m)){ hIdx=i; map=m; break; }
  }
  if(hIdx<0) throw new Error('找不到欄位名稱列，必要欄位：'+spec.required.map(k=>spec.cols.find(c=>c[0]===k)[1]).join('、'));
  const rows=[];
  for(let i=hIdx+1;i<aoa.length;i++){
    const r=aoa[i]; if(!r.some(x=>String(x).trim()!=='')) continue;
    const o={_row:i+1};
    spec.cols.forEach(c=>{ if(c[0] in map){ let v=r[map[c[0]]]; o[c[0]]=v==null?'':v; } });
    Object.keys(o).forEach(k=>{ if(k!=='_row'&&typeof o[k]==='string') o[k]=o[k].trim(); });
    if(kind==='progress'){
      o.id=String(o.id||'').trim().toUpperCase().replace(/^#/,'');
      if(o.progress!==''&&o.progress!=null){ const n=parseFloat(String(o.progress).replace('%','')); o.progress=isNaN(n)?'':(n>0&&n<1&&String(o.progress).indexOf('%')<0?Math.round(n*100):Math.max(0,Math.min(100,Math.round(n)))); }
      o.status=String(o.status||'').trim();
    } else if(kind==='tasks'){
      o.due=normDate(o.due);
      if(o.progress!==''&&o.progress!=null){ const n=parseFloat(String(o.progress).replace('%','')); o.progress=isNaN(n)?'':(n>0&&n<1&&String(o.progress).indexOf('%')<0?Math.round(n*100):Math.max(0,Math.min(100,Math.round(n)))); }
      o.type=/臨時/.test(String(o.type||''))?'臨時代辦':'專案執行';
    } else {
      o.role=/主管|管理/.test(String(o.role||''))?'主管':'員工';
      if(o.password!=null) o.password=String(o.password);
      if(o.account!=null) o.account=String(o.account);
    }
    o._err=checkRow(kind,o);
    rows.push(o);
  }
  return rows;
}
function checkRow(kind,o){
  const e=[];
  if(kind==='progress'){
    const t=S.tasks.find(x=>x.id===o.id);
    if(!o.id) return '編號空白';
    if(!t) return '找不到工作 #'+o.id;
    if(t.assignee!==S.me&&!isMgr(S.me)) return '這件工作的承辦人是 '+t.assignee;
    if(t.status==='完成') return '已確認完成，不能再修改';
    if(o.status&&['未開始','進行中','等待外部','暫停','完成','待確認'].indexOf(o.status)<0) return '看不懂狀態「'+o.status+'」';
    const changed=(o.status&&o.status!==t.status&&!(o.status==='完成'&&t.status==='待確認'))||(o.progress!==''&&o.progress!=null&&Number(o.progress)!==t.progress)||!!String(o.content||'').trim()||(o.waitingFor&&o.waitingFor!==t.waitingFor);
    if(!changed) o._skip=true;
    return '';
  }
  if(kind==='tasks'){
    if(!o.content) e.push('工作內容空白');
    if(!o.assignee) e.push('承辦人空白');
    else if(!S.people.some(p=>p.name===String(o.assignee))) e.push('人員表沒有「'+o.assignee+'」');
    if(!o.due) e.push('日期無法辨識');
  } else {
    if(!o.name) e.push('姓名空白');
    if(o.account && !o.password && !(S.admin||[]).some(p=>p.name===o.name&&p.hasPassword)) e.push('有帳號但沒有密碼');
  }
  return e.join('、');
}
let fileInput=null;
function pickFile(kind){
  if(!xlsxReady()) return;
  if(!fileInput){ fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='.xlsx,.xls,.csv'; fileInput.style.display='none'; document.body.appendChild(fileInput); }
  fileInput.value='';
  fileInput.onchange=()=>{
    const f=fileInput.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const rows=parseSheet(kind,new Uint8Array(rd.result));
        if(!rows.length) return toast('檔案裡沒有資料',true);
        S.modal={kind:'import',what:kind,rows,file:f.name,notify:false,color:'#8A55D6'}; renderModal();
      }catch(err){ toast(errMsg(err),true); }
    };
    rd.readAsArrayBuffer(f);
  };
  fileInput.click();
}
function importModalBody(m){

  const bad=m.rows.filter(r=>r._err).length, skip=m.rows.filter(r=>!r._err&&r._skip).length, good=m.rows.length-bad-skip;

    ${m.what==='tasks'?`<label class="check" style="margin-top:14px"><input type="checkbox" data-bind="m.notify" ${m.notify?'checked':''}> 寄 Email 通知承辦人（每位承辦人只收一封彙整通知）</label>`:''}`;

const FOUNTAIN={x:600,y:350,rx:96,ry:56};
const PZ_PROPS=[
  {k:'tree',x:90,y:150,s:1.15},{k:'tree',x:210,y:95,s:0.9},{k:'tree',x:1100,y:150,s:1.1},{k:'tree',x:985,y:92,s:0.85},
  {k:'tree',x:80,y:610,s:1.05},{k:'tree',x:1120,y:620,s:1.2},{k:'tree',x:330,y:70,s:0.75},{k:'tree',x:870,y:66,s:0.8},
  {k:'bench',x:405,y:205},{k:'bench',x:795,y:205},{k:'bench',x:400,y:530},{k:'bench',x:800,y:530},
  {k:'lamp',x:330,y:345},{k:'lamp',x:870,y:345},{k:'lamp',x:600,y:150},{k:'lamp',x:600,y:575}
];

function pzHash(s){ let h=2166136261; s=String(s); for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function pzRng(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; let t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function pzStyle(p){
  const g=p.gender==='女'||p.gender==='男'?p.gender:(pzHash(p.name)%2?'女':'男');
  const i=((p.avatar>=1&&p.avatar<=30)?p.avatar:(pzHash(p.name)%30+1))-1;
  return {g, idx:i+1, hair:(g==='女'?5:0)+(i%5), top:PZ_TOPS[i%10], bottom:PZ_BOTTOMS[(i*7)%8],
    hairColor:PZ_HAIRS[(Math.floor(i/10)*2+(i%3))%7], skin:PZ_SKINS[(i*3+Math.floor(i/10))%4]};
}

  return `<section class="panel pz-panel">

      <div class="head-acts"><button class="btn purple" data-act="pzAvatar">👗 換造型</button><button class="btn" data-act="pzFind">📍 找到我</button></div></div>
    <p class="pz-help">用 <b>方向鍵／WASD</b> 或 <b>點地面</b> 讓自己的人走過去；點別人可以看他的工作件數。每顆氣球代表一件未完成的工作。</p>
    <div class="pz-legend">
      <span><i style="background:${PZ_STATUS_COLOR.od}"></i>逾期</span><span><i style="background:${PZ_STATUS_COLOR.review}"></i>待確認</span>
      <span><i style="background:${PZ_STATUS_COLOR.wait}"></i>等待外部</span><span><i style="background:${PZ_STATUS_COLOR.pause}"></i>暫停</span>
      <span><i style="background:${PZ_STATUS_COLOR.doing}"></i>進行中</span><span><i style="background:${PZ_STATUS_COLOR.todo}"></i>未開始</span>
      <span class="pz-tag">👑 主管</span><span class="pz-tag">🦖 管理者</span>

      <div class="pz-card" id="pzCard" hidden></div>

function mountPlaza(){
  const cv=$('#pz'); if(!cv) return;
  PZ.canvas=cv; PZ.ctx=cv.getContext('2d');
  pzResize();
  if(!PZ.bg) PZ.bg=pzBuildBg();
  if(!PZ.flies.length){ const r=pzRng(7); for(let i=0;i<6;i++) PZ.flies.push({x:150+r()*900,y:150+r()*450,a:r()*6.28,c:['#FF8FB1','#FFD166','#9B8CFF','#7FD1FF','#FFFFFF','#FFB36B'][i],s:0.6+r()*0.5}); }
  if(!PZ.data && !PZ.loading) pzLoad();
  if(!PZ.poll) PZ.poll=setInterval(()=>{ if(PZ.canvas&&PZ.canvas.isConnected&&!document.hidden) pzLoad(); },20000);
  if(!PZ.raf){ PZ.last=performance.now(); PZ.raf=requestAnimationFrame(pzFrame); }
  cv.onpointerdown=pzPointer;
  if(S.modal&&S.modal.kind==='avatar') pzPaintGrid();
}
function unmountPlaza(){
  if(PZ.poll){ clearInterval(PZ.poll); PZ.poll=0; }
  if(PZ.raf){ cancelAnimationFrame(PZ.raf); PZ.raf=0; }
  PZ.canvas=null; PZ.sel=null;
}
function pzResize(){
  const cv=PZ.canvas; if(!cv) return;
  const w=cv.clientWidth||cv.parentNode.clientWidth||900, h=w*PZ.H/PZ.W;
  PZ.dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*PZ.dpr); cv.height=Math.round(h*PZ.dpr); cv.style.height=h+'px';
}
window.addEventListener('resize',()=>{ if(PZ.canvas&&PZ.canvas.isConnected) pzResize(); });

function pzLoad(){
  PZ.loading=true;
  api('api_plaza',S.token).then(d=>{ PZ.loading=false; pzApply(d); const l=document.querySelector('.pz-loading'); if(l) l.remove(); }).catch(e=>{ PZ.loading=false; onErr(e); });
}
function pzApply(d){
  PZ.data=d;
  const names=d.people.map(p=>p.name);
  Object.keys(PZ.chars).forEach(n=>{ if(names.indexOf(n)<0) delete PZ.chars[n]; });
  d.people.forEach((p,i)=>{
    let c=PZ.chars[p.name];
    const hasPos=p.x!=null&&p.y!=null;
    const ang=(i/Math.max(1,d.people.length))*Math.PI*2+0.4;
    const spot=hasPos?{x:p.x,y:p.y}:{x:FOUNTAIN.x+Math.cos(ang)*230,y:FOUNTAIN.y+30+Math.sin(ang)*150};
    if(!c){
      c=PZ.chars[p.name]={x:spot.x,y:spot.y,tx:null,ty:null,home:{...spot},dir:1,phase:0,walking:false,speed:0,seed:pzHash(p.name)%1000,wander:2+Math.random()*4};
      pzSafe(c);
    } else if(p.name!==S.me && hasPos && (Math.abs(p.x-c.home.x)>2||Math.abs(p.y-c.home.y)>2)){
      c.home={x:p.x,y:p.y}; c.tx=p.x; c.ty=p.y;
    }
    Object.assign(c,{p,style:pzStyle(p)});
  });
  if(PZ.chars[S.me]&&!PZ.lastSaved){ const c=PZ.chars[S.me]; PZ.lastSaved={x:c.x,y:c.y}; }
  PZ.order=Object.values(PZ.chars);
  if(PZ.sel) pzShowCard(PZ.sel);
}

/* 移動與碰撞 */
function pzSafe(c){
  c.x=Math.max(30,Math.min(PZ.W-30,c.x)); c.y=Math.max(120,Math.min(PZ.H-30,c.y));
  const dx=(c.x-FOUNTAIN.x)/(FOUNTAIN.rx+16), dy=(c.y-FOUNTAIN.y)/(FOUNTAIN.ry+14), d=Math.sqrt(dx*dx+dy*dy);
  if(d<1){ const k=d<0.01?1:1/d; c.x=FOUNTAIN.x+(c.x-FOUNTAIN.x||1)*k; c.y=FOUNTAIN.y+(c.y-FOUNTAIN.y)*k; }
  PZ_PROPS.forEach(o=>{ if(o.k!=='tree'&&o.k!=='lamp') return; const r=o.k==='tree'?22*o.s:10; const ex=c.x-o.x, ey=(c.y-o.y)*1.6, dd=Math.sqrt(ex*ex+ey*ey); if(dd<r&&dd>0.01){ c.x=o.x+ex/dd*r; c.y=o.y+ey/dd*r/1.6; } });
}
function pzUpdate(dt){
  PZ.t+=dt;
  const me=PZ.chars[S.me];
  Object.values(PZ.chars).forEach(c=>{
    let vx=0, vy=0, sp=0;
    if(c===me){
      const k=PZ.keys, kx=(k.ArrowRight||k.d?1:0)-(k.ArrowLeft||k.a?1:0), ky=(k.ArrowDown||k.s?1:0)-(k.ArrowUp||k.w?1:0);
      if(kx||ky){ const l=Math.hypot(kx,ky); vx=kx/l; vy=ky/l; sp=175; c.tx=null; }
    } else {
      c.wander-=dt;
      if(c.wander<=0&&c.tx==null){ const r=Math.random()*40+10, a=Math.random()*6.28; c.tx=c.home.x+Math.cos(a)*r; c.ty=c.home.y+Math.sin(a)*r*0.6; c.wander=4+Math.random()*6; }
    }
    if(!sp&&c.tx!=null){
      const dx=c.tx-c.x, dy=c.ty-c.y, d=Math.hypot(dx,dy);
      if(d<3){ c.tx=null; } else { vx=dx/d; vy=dy/d; sp=c===me?175:(d>80?110:45); }
    }
    if(sp){
      const ox=c.x, oy=c.y;
      c.x+=vx*sp*dt; c.y+=vy*sp*dt; pzSafe(c);
      if(Math.abs(c.x-ox)+Math.abs(c.y-oy)<0.05*sp*dt){ c.tx=null; }
      if(Math.abs(vx)>0.15) c.dir=vx>0?1:-1;
      c.walking=true; c.phase+=dt*sp*0.075; c.speed=Math.min(1,c.speed+dt*4);
    } else { c.walking=false; c.speed=Math.max(0,c.speed-dt*2.5); }
  });
  if(me){
    const moved=PZ.lastSaved&&(Math.abs(me.x-PZ.lastSaved.x)>3||Math.abs(me.y-PZ.lastSaved.y)>3);
    if(moved&&!me.walking&&!PZ.saveTimer){
      PZ.saveTimer=setTimeout(()=>{ PZ.saveTimer=0; const c=PZ.chars[S.me]; if(!c||c.walking) return; PZ.lastSaved={x:c.x,y:c.y}; api('api_plazaMove',S.token,Math.round(c.x),Math.round(c.y)).catch(()=>{}); },1200);
    }
  }
  PZ.flies.forEach(f=>{ f.a+=dt*(0.6+f.s*0.5); f.x+=Math.cos(f.a*0.7)*dt*40*f.s; f.y+=Math.sin(f.a*1.3)*dt*25*f.s; if(f.x<60||f.x>PZ.W-60) f.a+=Math.PI; f.y=Math.max(140,Math.min(PZ.H-60,f.y)); });
  if(Math.random()<dt*28) PZ.drops.push({x:FOUNTAIN.x+(Math.random()-0.5)*6,y:FOUNTAIN.y-58,vx:(Math.random()-0.5)*70,vy:-60-Math.random()*50,life:1});
  PZ.drops.forEach(d=>{ d.x+=d.vx*dt; d.y+=d.vy*dt; d.vy+=160*dt; d.life-=dt*0.9; });
  PZ.drops=PZ.drops.filter(d=>d.life>0&&d.y<FOUNTAIN.y-4);
  if(PZ.sel) pzShowCard(PZ.sel,true);
}
function pzFrame(now){
  if(!PZ.canvas||!PZ.canvas.isConnected){ PZ.raf=0; return; }
  const dt=Math.min(0.05,(now-PZ.last)/1000); PZ.last=now;
  pzUpdate(dt); pzDraw();
  PZ.raf=requestAnimationFrame(pzFrame);
}

/* 輸入 */
function pzTyping(){ const a=document.activeElement; return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName); }
document.addEventListener('keydown',e=>{
  if(!PZ.canvas||!PZ.canvas.isConnected||pzTyping()||S.modal) return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].indexOf(k)>=0){ PZ.keys[k]=true; e.preventDefault(); }
});
document.addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; PZ.keys[k]=false; });
window.addEventListener('blur',()=>{ PZ.keys={}; });
function pzToWorld(e){ const r=PZ.canvas.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*PZ.W, y:(e.clientY-r.top)/r.height*PZ.H}; }
function pzPointer(e){
  const w=pzToWorld(e);
  const hit=Object.values(PZ.chars).filter(c=>Math.abs(w.x-c.x)<20&&w.y<c.y+8&&w.y>c.y-80).sort((a,b)=>b.y-a.y)[0];
  if(hit&&hit.p.name!==S.me){ PZ.sel=hit.p.name; pzShowCard(PZ.sel); return; }
  if(hit&&hit.p.name===S.me){ PZ.sel=S.me; pzShowCard(S.me); return; }
  PZ.sel=null; pzShowCard(null);
  const me=PZ.chars[S.me]; if(me){ me.tx=w.x; me.ty=w.y; }
  PZ.canvas.focus({preventScroll:true});
}
function pzShowCard(name,onlyMove){
  const el=$('#pzCard'); if(!el) return;
  const c=name&&PZ.chars[name];
  if(!c){ el.hidden=true; return; }
  const r=PZ.canvas.getBoundingClientRect(), k=r.width/PZ.W;
  if(!onlyMove||el.hidden){
    const p=c.p, rl=p.super?'🦖 管理者':(p.role==='主管'?'👑 主管':'員工');
    el.innerHTML=`<div class="pz-card-h">${avatar(p.name)}<b>${esc(p.name)}</b><span class="role ${p.role==='主管'?'mgr':''}">${rl}</span><button class="x" data-act="pzClose">×</button></div>
      <div class="pz-stats"><div><b>${p.open}</b>未完成</div><div class="od"><b>${p.overdue}</b>逾期</div><div class="rv"><b>${p.review}</b>待確認</div><div class="wt"><b>${p.waiting}</b>等待外部</div><div class="dn"><b>${p.doneWeek}</b>7 天內完成</div></div>
      ${p.name===S.me?'<div class="pz-me">這是你！<button class="btn sm purple" data-act="pzAvatar">換造型</button></div>':''}`;
    el.hidden=false;
  }
  const x=c.x*k, y=(c.y-90)*k, w=el.offsetWidth||230;
  el.style.left=Math.max(6,Math.min(r.width-w-6,x-w/2))+'px';
  el.style.top=Math.max(6,y-el.offsetHeight)+'px';
}

/* 背景（靜態，只畫一次） */
function pzBuildBg(){
  const c=document.createElement('canvas'), sc=2; c.width=PZ.W*sc; c.height=PZ.H*sc;
  const g=c.getContext('2d'); g.scale(sc,sc);
  const r=pzRng(42);
  const grd=g.createLinearGradient(0,0,0,PZ.H); grd.addColorStop(0,'#A8DC87'); grd.addColorStop(1,'#7DC266');
  g.fillStyle=grd; g.fillRect(0,0,PZ.W,PZ.H);
  g.save(); g.globalAlpha=0.07; g.fillStyle='#FFFFFF';
  for(let i=-PZ.H;i<PZ.W;i+=70){ g.beginPath(); g.moveTo(i,0); g.lineTo(i+35,0); g.lineTo(i+35+PZ.H*0.5,PZ.H); g.lineTo(i+PZ.H*0.5,PZ.H); g.closePath(); g.fill(); }
  g.restore();
  for(let i=0;i<500;i++){ g.fillStyle=r()<0.5?'rgba(60,130,50,.25)':'rgba(255,255,255,.18)'; const x=r()*PZ.W, y=r()*PZ.H; g.fillRect(x,y,2,4); }
  /* 小徑 */
  g.fillStyle='#EADFC8';
  pzRound(g,FOUNTAIN.x-38,0,76,PZ.H,30); g.fill();
  pzRound(g,0,FOUNTAIN.y-30,PZ.W,62,28); g.fill();
  g.strokeStyle='rgba(160,130,90,.18)'; g.lineWidth=2; g.setLineDash([10,14]);
  g.beginPath(); g.moveTo(FOUNTAIN.x,0); g.lineTo(FOUNTAIN.x,PZ.H); g.moveTo(0,FOUNTAIN.y); g.lineTo(PZ.W,FOUNTAIN.y); g.stroke(); g.setLineDash([]);
  /* 廣場石磚 */
  g.fillStyle='#F2E8D5'; g.beginPath(); g.ellipse(FOUNTAIN.x,FOUNTAIN.y+8,300,185,0,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(170,140,100,.25)'; g.lineWidth=1.5;
  [270,230,190,150].forEach(rr=>{ g.beginPath(); g.ellipse(FOUNTAIN.x,FOUNTAIN.y+8,rr,rr*0.62,0,0,Math.PI*2); g.stroke(); });
  for(let a=0;a<Math.PI*2;a+=Math.PI/12){ g.beginPath(); g.moveTo(FOUNTAIN.x+Math.cos(a)*120,FOUNTAIN.y+8+Math.sin(a)*74); g.lineTo(FOUNTAIN.x+Math.cos(a)*298,FOUNTAIN.y+8+Math.sin(a)*184); g.stroke(); }
  g.strokeStyle='#D9C7A6'; g.lineWidth=4; g.beginPath(); g.ellipse(FOUNTAIN.x,FOUNTAIN.y+8,300,185,0,0,Math.PI*2); g.stroke();
  /* 花圃 */
  const beds=[[220,250],[980,250],[220,500],[980,500],[440,640],[760,640],[460,110],[740,110]];
  const FC=['#FF6F91','#FFC75F','#C493FF','#FFFFFF','#FF9671','#F9F871','#FF8FD8'];
  beds.forEach((b,bi)=>{
    g.fillStyle='rgba(0,0,0,.08)'; g.beginPath(); g.ellipse(b[0],b[1]+6,72,26,0,0,Math.PI*2); g.fill();
    g.fillStyle='#5E9E4B'; g.beginPath(); g.ellipse(b[0],b[1],70,24,0,0,Math.PI*2); g.fill();
    g.fillStyle='#6FB257'; g.beginPath(); g.ellipse(b[0],b[1]-3,64,19,0,0,Math.PI*2); g.fill();
    for(let i=0;i<22;i++){
      const fx=b[0]+(r()-0.5)*118, fy=b[1]+(r()-0.5)*32; const col=FC[(bi+i)%FC.length];
      g.fillStyle='#3E7D33'; g.fillRect(fx-0.7,fy,1.4,6);
      g.fillStyle=col; for(let k=0;k<5;k++){ const a=k*Math.PI*2/5; g.beginPath(); g.arc(fx+Math.cos(a)*3.2,fy+Math.sin(a)*3.2,2.6,0,Math.PI*2); g.fill(); }
      g.fillStyle='#FFE066'; g.beginPath(); g.arc(fx,fy,1.8,0,Math.PI*2); g.fill();
    }
  });
  /* 上方樹籬 */
  for(let x=-20;x<PZ.W+40;x+=46){ if(Math.abs(x-FOUNTAIN.x)<60) continue; g.fillStyle='#4F9A44'; g.beginPath(); g.arc(x,38,32,0,Math.PI*2); g.fill(); g.fillStyle='#62AD52'; g.beginPath(); g.arc(x-6,30,22,0,Math.PI*2); g.fill(); }
  g.fillStyle='#3F8537'; g.fillRect(0,48,FOUNTAIN.x-60,22); g.fillRect(FOUNTAIN.x+60,48,PZ.W,22);
  /* 拱門招牌 */
  g.fillStyle='#A9744F'; g.fillRect(FOUNTAIN.x-58,22,8,70); g.fillRect(FOUNTAIN.x+50,22,8,70);
  g.fillStyle='#FFF4E0'; pzRound(g,FOUNTAIN.x-82,14,164,34,10); g.fill(); g.strokeStyle='#C98A5A'; g.lineWidth=3; g.stroke();
  g.fillStyle='#8A4F2A'; g.font='700 19px "Noto Sans TC",sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('🌷 花園廣場',FOUNTAIN.x,32);
  return c;
}
function pzRound(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* 每格畫面 */
function pzDraw(){
  const g=PZ.ctx, cv=PZ.canvas; if(!g) return;
  const k=cv.width/PZ.W;
  g.setTransform(k,0,0,k,0,0);
  g.drawImage(PZ.bg,0,0,PZ.W,PZ.H);
  const items=PZ_PROPS.map(o=>({y:o.y,f:()=>pzProp(g,o)}));
  items.push({y:FOUNTAIN.y,f:()=>pzFountain(g)});
  Object.values(PZ.chars).forEach(c=>{ if(c.p) items.push({y:c.y,f:()=>pzChar(g,c,PZ.t,c.p.name===S.me)}); });
  items.sort((a,b)=>a.y-b.y).forEach(it=>it.f());
  Object.values(PZ.chars).forEach(c=>{ if(c.p) pzTag(g,c); });
  PZ.flies.forEach(f=>pzFly(g,f));
}
function pzFountain(g){
  const F=FOUNTAIN, t=PZ.t;
  g.fillStyle='rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(F.x,F.y+12,F.rx+8,F.ry+6,0,0,Math.PI*2); g.fill();
  g.fillStyle='#CFC3AE'; g.beginPath(); g.ellipse(F.x,F.y+6,F.rx,F.ry,0,0,Math.PI*2); g.fill();
  g.fillStyle='#E9E0CF'; g.beginPath(); g.ellipse(F.x,F.y,F.rx,F.ry,0,0,Math.PI*2); g.fill();
  const wg=g.createRadialGradient(F.x,F.y,10,F.x,F.y,F.rx); wg.addColorStop(0,'#8FE3FF'); wg.addColorStop(1,'#4BB4E6');
  g.fillStyle=wg; g.beginPath(); g.ellipse(F.x,F.y+2,F.rx-12,F.ry-9,0,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(255,255,255,.55)'; g.lineWidth=1.5;
  for(let i=0;i<3;i++){ const p=((t*0.35+i/3)%1); g.globalAlpha=1-p; g.beginPath(); g.ellipse(F.x,F.y+2,14+p*(F.rx-28),8+p*(F.ry-20),0,0,Math.PI*2); g.stroke(); }
  g.globalAlpha=1;
  g.fillStyle='#D8CCB6'; g.fillRect(F.x-7,F.y-46,14,48);
  g.fillStyle='#E9E0CF'; g.beginPath(); g.ellipse(F.x,F.y-46,26,9,0,0,Math.PI*2); g.fill();
  g.fillStyle='#7FD6F7'; g.beginPath(); g.ellipse(F.x,F.y-47,20,6,0,0,Math.PI*2); g.fill();
  g.fillStyle='rgba(200,240,255,.9)'; PZ.drops.forEach(d=>{ g.globalAlpha=Math.max(0,d.life); g.beginPath(); g.arc(d.x,d.y,2,0,Math.PI*2); g.fill(); });
  g.globalAlpha=1;
}

/* 人物 */
function pzBalloonColors(p){ return (p.bal||[]).map(k=>PZ_STATUS_COLOR[k]||PZ_STATUS_COLOR.doing); }
function pzChar(g,c,t,isMe){
  const st=c.style, p=c.p, x=c.x, y=c.y;
  const sw=c.walking?Math.sin(c.phase):0;
  const bob=c.walking?Math.abs(Math.sin(c.phase))*2.2:Math.sin(t*2+c.seed)*0.8;
  if(isMe){ g.strokeStyle='rgba(45,91,227,.55)'; g.lineWidth=2.5; g.beginPath(); g.ellipse(x,y,22,7,0,0,Math.PI*2); g.stroke(); }
  g.fillStyle='rgba(0,0,0,.18)'; g.beginPath(); g.ellipse(x,y,15,4.5,0,0,Math.PI*2); g.fill();
  /* 氣球（先畫在身後） */

  const hx=x+12*c.dir, hy=y-25-bob;
  for(let i=0;i<n;i++){
    const off=i-(n-1)/2;
    const swing=Math.sin(t*1.7+i*1.3+c.seed)*(2.5+c.speed*7)-c.speed*c.dir*10;
    const bx=hx+off*15+swing, by=hy-56-Math.abs(off)*5-(i%2)*10;
    g.strokeStyle='rgba(90,90,110,.55)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(hx,hy); g.quadraticCurveTo(hx+off*6+swing*0.4,hy-25,bx,by+12); g.stroke();
    g.fillStyle=cols[i]; g.beginPath(); g.ellipse(bx,by,9,11,Math.sin(t+i)*0.08,0,Math.PI*2); g.fill();
    g.beginPath(); g.moveTo(bx-2.5,by+12.5); g.lineTo(bx+2.5,by+12.5); g.lineTo(bx,by+9.5); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,.55)'; g.beginPath(); g.ellipse(bx-3,by-4,2.4,3.6,-0.5,0,Math.PI*2); g.fill();
    if(i===n-1&&p.open>10){ g.fillStyle='#fff'; g.font='700 9px Inter,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('+'+(p.open-9),bx,by+1); }
  }
  g.save(); g.translate(x,0); g.scale(c.dir,1); g.translate(-x,0);
  const female=st.g==='女';
  /* 腿 */

  g.fillStyle=female?st.skin:st.bottom;
  pzRound(g,x-8+lx,y-17-l1,6,15,3); g.fill(); pzRound(g,x+2-lx,y-17-l2,6,15,3); g.fill();
  g.fillStyle='#3B3B4F'; g.beginPath(); g.ellipse(x-5+lx,y-1.5-l1,4.5,2.5,0,0,Math.PI*2); g.fill(); g.beginPath(); g.ellipse(x+5-lx,y-1.5-l2,4.5,2.5,0,0,Math.PI*2); g.fill();
  /* 身體 */
  const by0=y-38-bob;
  g.fillStyle=st.top; pzRound(g,x-11,by0,22,22,8); g.fill();
  if(female){ g.fillStyle=st.bottom; g.beginPath(); g.moveTo(x-11,by0+15); g.lineTo(x+11,by0+15); g.lineTo(x+15,by0+27); g.lineTo(x-15,by0+27); g.closePath(); g.fill(); }
  else { g.fillStyle='rgba(255,255,255,.35)'; g.beginPath(); g.moveTo(x-4,by0+1); g.lineTo(x,by0+6); g.lineTo(x+4,by0+1); g.closePath(); g.fill(); }
  /* 手臂 */

  g.beginPath(); g.moveTo(x-9,by0+5); g.lineTo(x-13-as*6,by0+16); g.stroke();
  g.beginPath(); g.moveTo(x+9,by0+5); g.lineTo(x+12,by0+14); g.stroke();
  g.fillStyle=st.skin; g.beginPath(); g.arc(x-13-as*6,by0+17,3.2,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(x+12,by0+15,3.2,0,Math.PI*2); g.fill();
  /* 頭 */

function pzFace(g,x,y,t,c){

    g.fillStyle='#fff'; g.beginPath(); g.arc(x-4.3,y-2,0.9,0,Math.PI*2); g.fill(); g.beginPath(); g.arc(x+5.7,y-2,0.9,0,Math.PI*2); g.fill(); }

function pzHairFront(g,st,x,y){

  else if(h===4){ g.beginPath(); g.arc(x,y-1,17.5,Math.PI*0.96,Math.PI*2.04); g.lineTo(x+16,y-3); g.lineTo(x-16,y-3); g.closePath(); g.fill(); }

function pzCrown(g,x,y,t){
  const s=Math.sin(t*2)*0.6;

function pzDino(g,x,y,st,t,c){

}
function pzTag(g,c){

/* 複製帶格式的內容（貼到 Gmail 會保留表格） */
function copyRich(html,plain){
  let ok=false;
  const box=document.createElement('div');
  box.contentEditable='true'; box.style.cssText='position:fixed;left:-9999px;top:0;width:700px';
  box.innerHTML=html; document.body.appendChild(box);
  const sel=window.getSelection(), rg=document.createRange();
  try{ rg.selectNodeContents(box); sel.removeAllRanges(); sel.addRange(rg); ok=document.execCommand('copy'); }catch(e){ ok=false; }
  sel.removeAllRanges(); box.remove();
  if(!ok&&navigator.clipboard&&window.ClipboardItem){
    try{ navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})})]); ok=true; }catch(e){ ok=false; }
  }
  return ok;
}

function sheetFrom(rows,widths){ const ws=XLSX.utils.aoa_to_sheet(rows); ws['!cols']=widths.map(w=>({wch:w})); if(rows.length>1) ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length-1,c:rows[0].length-1}})}; return ws; }
function buildExport(d){

  if(d.reports.length) XLSX.utils.book_append_sheet(wb,sheetFrom([['日期','星期','承辦人','寄出時間','回報說明','AI 摘要'],...d.reports.map(r=>[r.day,wdOf(r.day),r.name,r.time,r.text,r.ai])],[11,5,8,8,70,50]),'日報');

  const DH=['時間','承辦人','編號','專案','工作內容','狀態','進度','回報內容','來源'];

/* ═════════ AI 顯示 ═════════ */
function mdHtml(text){
  const out=[]; let inList=false;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  String(text||'').split('\n').forEach(raw=>{
    const line=raw.trim();
    const li=line.match(/^[-*•]\s+(.*)$/)||line.match(/^\d+[.)、]\s+(.*)$/);
    if(li){ if(!inList){ out.push('<ul>'); inList=true; } out.push('<li>'+inl(li[1])+'</li>'); return; }
    if(inList){ out.push('</ul>'); inList=false; }
    if(!line) return;
    const h=line.match(/^#{1,4}\s+(.*)$/);
    out.push(h?'<h4>'+inl(h[1])+'</h4>':'<p>'+inl(line)+'</p>');
  });
  if(inList) out.push('</ul>');
  return out.join('');
}

const QUICK=['本週','上週','本月','近 30 天'];
function quickRange(k){
  const t=S.today, dow=(new Date(t+'T00:00').getDay()+6)%7, mon=addDays(t,-dow);
  if(k==='本週') return [mon,t];
  if(k==='上週') return [addDays(mon,-7),addDays(mon,-1)];
  if(k==='本月') return [t.slice(0,8)+'01',t];
  return [addDays(t,-29),t];
}
function mdw(day){ const d=new Date(day+'T00:00'); return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）'; }
function addDays(day,n){ const d=new Date(day+'T00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function copyText(txt,msg){

  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
  else fallbackCopy(txt,ok);
}

/* ═════════ 統計圖表（主管） ═════════ */
function bucket(t){ if(t.status==='完成') return 'done'; if(t.status==='待確認') return 'review'; if(t.status==='未開始') return 'todo'; return 'active'; }
function agg(list){
  const a={total:list.length,done:0,review:0,active:0,todo:0,od:0};
  list.forEach(t=>{ a[bucket(t)]++; if(isOverdue(t)) a.od++; });
  a.rate=a.total?Math.round(a.done/a.total*100):0;
  return a;
}
function inPeriod(t){
  const p=S.sf.period;
  if(p==='全部') return true;
  if(!t.assignedAt) return false;
  if(p==='本週'){ const d=t.assignedAt.slice(0,10); return d>=quickRange('本週')[0] && d<=S.today; }
  if(p==='本月') return t.assignedAt.slice(0,7)===S.today.slice(0,7);
  if(p==='近 30 天') return dayDiff(t.assignedAt,S.today)<=30;
  return true;
}
function ring(a,color){
  const r=52, C=2*Math.PI*r, gap=a.done&&a.review?3:0;
  const d=a.total?a.done/a.total:0, rv=a.total?a.review/a.total:0;
  const arc=(len,off,col,tip)=>len>0?`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${Math.max(0,len)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" data-tip="${tip}"/>`:'';
  return `<svg class="ring" viewBox="0 0 140 140" role="img" aria-label="完成度 ${a.rate}%">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#EDEDF2" stroke-width="16"/>
    ${arc(C*d-gap,0,'#14917F','完成 '+a.done+' 件')}
    ${arc(C*rv-gap,C*d,'#C98A00','待確認 '+a.review+' 件')}
    <text x="70" y="72" text-anchor="middle" class="n">${a.rate}%</text>
    <text x="70" y="93" text-anchor="middle" class="s">完成度</text></svg>`;
}
function ringBox(title,a,cls){
  return `<div class="ringbox ${cls}">${ring(a)}<div><h3>${title}</h3><div class="rlist">
    <div>已完成 <b>${a.done}</b> / 共 <b>${a.total}</b> 件</div>
    <div>待主管確認 <b>${a.review}</b> 件</div>
    <div>執行中 <b>${a.active}</b>・未開始 <b>${a.todo}</b></div>
    <div style="color:${a.od?'#C23A72':'inherit'}">逾期 <b style="color:inherit">${a.od}</b> 件</div></div></div></div>`;
}
function stackRow(label,swatch,a,isAvatar){

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=A[el.dataset.act]; if(fn) fn(el,e);
});
function onBind(e){
  const b=e.target.dataset&&e.target.dataset.bind; if(!b) return;
  const val=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(b==='q'){ S.f.q=val; $('#main').innerHTML=mainHtml(); return; }
  if(b==='aq'){ S.af.q=val; const el=$('#assignList'); if(el) el.innerHTML=assignListHtml(); return; }
  const [scope,key]=b.split('.');
  if(scope==='login'){ S.login[key]=val; return; }
  if(scope==='ar'){ S.aiRange[key]=val; if(e.type==='change') render(); return; }
  if(scope==='m'&&S.modal&&S.modal.kind==='export'&&(key==='from'||key==='to'||key==='who')){ S.modal[key]=val; if(e.type==='change') renderModal(); return; }
  if(scope==='st'){ S.sets[key]=val; return; }
  if(b==='sfwho'){ S.sf.who=val; render(); return; }
  if(scope==='form') S.form[key]=val;
  if(scope==='m' && S.modal){
    S.modal[key]=val;
    if(key==='progress'){ const pv=$('#progVal'); if(pv) pv.textContent=val+'%'; }
    if(key==='useProg'){ if(val&&S.modal.progress==='') S.modal.progress=0; renderModal(); }
  }
}
document.addEventListener('input',onBind);
document.addEventListener('change',e=>{ if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||(e.target.type==='date'&&/^(ar|m)\./.test(e.target.dataset.bind||''))) onBind(e); });
