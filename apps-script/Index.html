<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日工作追蹤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F1F3; --panel:#FFFFFF; --line:#E1E1E8; --line-2:#D2D2DC;
  --ink:#1C1B2E; --muted:#6C6B80; --faint:#9A99AB;
  --blue:#2D5BE3; --blue-2:#5B97F5; --blue-soft:#ECF1FE;
  --purple:#8A55D6; --purple-soft:#F6EFFD; --purple-line:#E6D2F8; --purple-badge:#E4C8F8; --purple-ink:#3B1E63;
  --pink:#E0508A; --pink-soft:#FDEDF4;
  --teal:#14917F; --teal-soft:#E3F5F1;
  --orange:#E0791F; --orange-soft:#FDF1E5;
  --amber:#C98A00; --amber-ink:#8A5E00; --amber-soft:#FFF5D6;
  --gray-soft:#F2F2F5; --track:#E4E4EC;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.busy button{pointer-events:none;opacity:.6}

/* 頂部 */
.demo{background:var(--purple-soft);border-bottom:1px solid var(--purple-line);color:var(--purple-ink);font-size:13.5px;text-align:center;padding:7px 16px}
.rainbow{height:5px;background:linear-gradient(90deg,#2D5BE3 0%,#5B97F5 22%,#8A55D6 45%,#E0508A 68%,#E0791F 86%,#C98A00 100%)}
.topbar{background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:0 auto;padding:18px 28px 0}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:19px}
.mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2D5BE3,#8A55D6 60%,#E0508A);color:#fff;display:grid;place-items:center}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 6px 4px 4px;font-size:14px;cursor:pointer}
.who:hover{border-color:var(--blue-2)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:12.5px;font-weight:700;flex:none}
.role{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--blue-soft);color:var(--blue);font-weight:600}
.role.mgr{background:var(--purple-badge);color:var(--purple-ink)}
.tabs{display:flex;gap:12px;margin-top:20px;overflow-x:auto;scrollbar-width:none}
.tab{display:flex;align-items:center;gap:10px;padding:13px 22px;font-size:16.5px;font-weight:700;background:#fff;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;position:relative;top:1px}
.tab.on{background:var(--bg)}
.tab.accent:not(.on){background:var(--purple-soft);border-color:var(--purple-line);box-shadow:0 -3px 16px rgba(138,85,214,.14)}
.tab svg{width:21px;height:21px}
.tab .ic{color:var(--blue)} .tab .ic.p{color:var(--purple)} .tab .ic.k{color:var(--pink)} .tab .ic.t{color:var(--teal)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px;background:var(--purple-badge);color:var(--purple-ink);letter-spacing:.03em}

/* 版面 */
.wrap{max-width:1320px;margin:0 auto;padding:30px 28px 60px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:36px;align-items:start}
.wrap.single{grid-template-columns:minmax(0,1fr)}
.side .search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:3px;padding:10px 14px}
.side .search input{border:none;outline:none;flex:1;background:transparent;min-width:0}
.side h4{display:flex;align-items:center;gap:8px;margin:24px 0 11px;font-size:16px}
.side h4 svg{width:18px;height:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:14.5px;cursor:pointer;line-height:1.4;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--blue-2)}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.pill .n{color:var(--faint);font-size:12.5px}
.pill.on .n{color:rgba(255,255,255,.82)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.panel{background:#fff;border:1px solid var(--line);border-radius:3px;padding:28px 32px}
.panel+.panel{margin-top:24px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel h2{margin:0;font-size:21px}
.head-acts{display:flex;gap:10px;flex-wrap:wrap}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}

/* 彩色統計磚 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin:18px 0 6px}
.tile{border-radius:6px;padding:12px 14px;border:1px solid transparent}
.tile .k{font-size:13px;font-weight:600}
.tile .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:2px;color:var(--ink)}
.tile .v small{font-size:13px;font-weight:600;color:var(--muted);margin-left:4px}
.tile.c-blue{background:var(--blue-soft);border-color:#D6E1FC} .tile.c-blue .k{color:var(--blue)}
.tile.c-purple{background:var(--purple-soft);border-color:var(--purple-line)} .tile.c-purple .k{color:var(--purple)}
.tile.c-pink{background:var(--pink-soft);border-color:#F8D3E3} .tile.c-pink .k{color:#C23A72}
.tile.c-teal{background:var(--teal-soft);border-color:#C6EAE2} .tile.c-teal .k{color:#0E7466}
.tile.c-amber{background:var(--amber-soft);border-color:#F5E2A8} .tile.c-amber .k{color:var(--amber-ink)}
.tile.c-orange{background:var(--orange-soft);border-color:#F8DCC0} .tile.c-orange .k{color:#B85E10}

.sec-title{font-size:16.5px;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title .sw{width:12px;height:12px;border-radius:3px}
.sec-title .cnt{font-size:12.5px;color:var(--muted);background:var(--gray-soft);border-radius:999px;padding:1px 9px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:16px}

/* 卡片 */
.card{border:1px solid var(--line);border-radius:4px;background:#fff;display:flex;flex-direction:column;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;overflow:hidden;border-top:4px solid var(--pc,#2D5BE3)}
.card:hover{box-shadow:0 6px 18px rgba(28,27,46,.10);transform:translateY(-1px)}
.viz{padding:13px 16px 12px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--pct,#F5F8FF),#fff)}
.viz-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.big{font-size:26px;font-weight:700;letter-spacing:-.01em;color:var(--blue);line-height:1.1}
.big.todo{color:var(--faint)} .big.done{color:var(--teal)} .big.wait{color:var(--purple)} .big.pause{color:var(--orange)} .big.review{color:var(--amber)} .big.od{color:var(--pink)}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-todo{background:var(--gray-soft);color:var(--muted)}
.st-doing{background:var(--blue-soft);color:var(--blue)}
.st-wait{background:var(--purple-soft);color:var(--purple)}
.st-pause{background:var(--orange-soft);color:#B85E10}
.st-review{background:var(--amber-soft);color:var(--amber-ink)}
.st-done{background:var(--teal-soft);color:#0E7466}
.st-od{background:var(--pink-soft);color:#C23A72}
.bar{height:8px;border-radius:4px;background:#fff;margin-top:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--track)}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.bar.done i{background:linear-gradient(90deg,#14917F,#3CC2A8)}
.tbar{height:3px;background:var(--track);margin-top:9px;border-radius:2px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--purple)}
.tbar.od i{background:var(--pink)} .tbar.done i{background:var(--teal)}
.viz-sub{font-size:12.5px;color:var(--muted);margin-top:7px;display:flex;justify-content:space-between;gap:8px}
.viz-sub .od{color:#C23A72;font-weight:600}
.body{padding:12px 16px 6px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ptag{font-size:12.5px;font-weight:600;padding:1px 9px;border-radius:4px}
.stag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--orange-soft);color:#B85E10}
.content{font-weight:600;margin-top:6px}
.latest{font-size:13.5px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12.5px;color:var(--faint);margin-top:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.meta .av{width:20px;height:20px;font-size:10.5px}
.acts{display:flex;gap:8px;padding:8px 16px 14px;flex-wrap:wrap}
.wait-note{font-size:12.5px;color:var(--amber-ink);background:var(--amber-soft);border-radius:4px;padding:4px 10px}

/* 按鈕與表單 */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:14.5px}
.btn:hover{border-color:var(--blue-2)}
.btn.sm{padding:5px 12px;font-size:13.5px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#2450CF}
.btn.purple{background:var(--purple-soft);border-color:var(--purple-line);color:var(--purple-ink)}
.btn.teal{background:var(--teal-soft);border-color:#BFE6DF;color:#0E6F63}
.btn.amber{background:var(--amber-soft);border-color:#F2DC9E;color:var(--amber-ink)}
.btn.pink{background:var(--pink-soft);border-color:#F6CFE0;color:#B32F66}
.btn.danger{background:#D63B6F;border-color:#D63B6F;color:#fff}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px;margin-top:22px}
.d-body .form-grid{margin-top:0}
.full{grid-column:1/-1}
.field label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
.field label .opt{font-weight:400;color:var(--faint);font-size:12.5px;margin-left:6px}
.inp{width:100%;border:1px solid var(--line-2);border-radius:4px;padding:10px 12px;background:#fff;outline:none}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
textarea.inp{resize:vertical;min-height:84px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.form-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}

/* 統計圖表 */
.filters{display:flex;gap:22px;flex-wrap:wrap;align-items:center;margin-top:18px}
.filters .lbl{font-size:13px;color:var(--muted);font-weight:600;margin-right:4px}
.fgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:22px}
.ringbox{border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;gap:18px;align-items:center}
.ringbox.proj{border-top:4px solid var(--blue)} .ringbox.temp{border-top:4px solid var(--pink)}
.ring{width:132px;height:132px;flex:none}
.ring .n{font-size:27px;font-weight:700;fill:var(--ink)}
.ring .s{font-size:12px;fill:var(--muted)}
.ringbox h3{margin:0 0 8px;font-size:16px}
.rlist{font-size:13.5px;color:var(--muted);display:grid;gap:4px}
.rlist b{color:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rows{display:grid;gap:12px;margin-top:12px}
.row{display:grid;grid-template-columns:minmax(120px,220px) minmax(0,1fr) 150px;gap:14px;align-items:center}
.row .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:0}
.row .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .nm .sw{width:10px;height:10px;border-radius:3px;flex:none}
.sbar{display:flex;gap:2px;height:16px}
.sbar i{display:block;min-width:4px}
.sbar i:first-child{border-radius:4px 0 0 4px} .sbar i:last-child{border-radius:0 4px 4px 0} .sbar i:only-child{border-radius:4px}
.row .num{font-size:13.5px;color:var(--muted);text-align:right;white-space:nowrap}
.row .num b{color:var(--ink);font-size:15px}
.row .num .odn{color:#C23A72;font-weight:600;margin-left:6px}
details.tbl{margin-top:16px}
details.tbl summary{cursor:pointer;color:var(--blue);font-size:13.5px;font-weight:600}
table.data{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:10px}
table.data th,table.data td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data th{color:var(--muted);font-weight:600;background:var(--gray-soft)}
#tip{position:fixed;pointer-events:none;background:#1C1B2E;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:4px;z-index:70;white-space:nowrap;display:none}

/* 視窗 */
.overlay{position:fixed;inset:0;background:rgba(28,27,46,.38);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.dialog{background:#fff;border-radius:8px;width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(28,27,46,.25);border-top:5px solid var(--dc,#2D5BE3)}
.dialog.wide{max-width:680px}
.d-head{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.d-head h3{margin:0;font-size:18px}
.d-head .sub{font-size:13px;color:var(--muted);margin-top:3px}
.x{border:none;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--faint);padding:2px 6px}
.d-body{padding:18px 24px}
.d-foot{padding:0 24px 22px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.d-foot .left{margin-right:auto}
.prog-row{display:flex;align-items:center;gap:14px}
.prog-row input[type=range]{flex:1;accent-color:var(--blue)}
.prog-val{font-weight:700;color:var(--blue);min-width:48px;text-align:right}
.report-text{width:100%;min-height:320px;font-size:14px;line-height:1.75;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-all}
.hist{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.hist h4{margin:0 0 10px;font-size:14.5px}
.h-item{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.h-item .t{color:var(--faint)}
.h-item .src{font-size:11.5px;color:var(--purple);background:var(--purple-soft);border-radius:3px;padding:0 6px;margin-left:6px}
.names{display:flex;flex-wrap:wrap;gap:10px}
.names .pill{padding:6px 14px 6px 6px;font-size:15px}
.note{font-size:13.5px;color:var(--muted);background:var(--gray-soft);border-radius:4px;padding:10px 12px;margin-bottom:14px}
.toast{position:fixed;right:24px;bottom:24px;background:var(--blue);color:#fff;font-weight:700;padding:12px 20px;border-radius:6px;box-shadow:0 8px 24px rgba(45,91,227,.3);z-index:60;max-width:calc(100vw - 48px)}
.toast.err{background:#D63B6F}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.range-hint{margin-top:12px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.range-hint b{color:var(--ink)}
.range-hint .stale{background:var(--amber-soft);color:var(--amber-ink);border-radius:999px;padding:2px 10px;font-weight:600;font-size:12.5px}
button.tile{font:inherit;text-align:left;cursor:pointer;transition:box-shadow .15s,transform .15s}
button.tile:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(28,27,46,.08)}
button.tile.on{box-shadow:0 0 0 2px currentColor inset}
button.tile.c-blue.on{color:var(--blue)} button.tile.c-purple.on{color:var(--purple)} button.tile.c-amber.on{color:var(--amber)}
button.tile.c-pink.on{color:var(--pink)} button.tile.c-teal.on{color:var(--teal)}
button.tile .hint2{font-size:11.5px;color:var(--faint);margin-top:2px}
.fnote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--amber-soft);border:1px solid #F2DC9E;color:var(--amber-ink);border-radius:6px;padding:10px 14px;margin:16px 0 0;font-size:14px}
.fnote .fc{background:#fff;border:1px solid #F2DC9E;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600}
.fnote .cnt2{margin-left:auto;font-weight:600}
.fnote .sub2{flex-basis:100%;font-size:12.5px;color:#9A7A2E}
.list-tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:16px}
.list-tools .search{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line-2);border-radius:4px;padding:8px 12px;flex:1;min-width:220px;max-width:420px}
.list-tools .search input{border:none;outline:none;flex:1;background:transparent;min-width:0}
.set-sec{border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-top:18px}
.set-sec h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}
.set-sec .desc{font-size:13.5px;color:var(--muted);margin:0 0 14px}
.set-sec ol{margin:0 0 14px;padding-left:20px;font-size:13.5px;color:var(--muted);line-height:1.8}
.set-sec a{color:var(--blue)}
.key-state{font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px}
.key-state.on{background:var(--teal-soft);color:#0E7466} .key-state.off{background:var(--pink-soft);color:#C23A72}
.test-res{margin-top:12px;font-size:14px;border-radius:4px;padding:9px 12px}
.ai-box{background:linear-gradient(135deg,#F6EFFD,#ECF1FE);border:1px solid var(--purple-line);border-radius:6px;padding:12px 16px;font-size:14.5px;line-height:1.75;color:var(--ink)}
.ai-box h4{margin:10px 0 4px;font-size:15px;color:var(--purple-ink)} .ai-box h4:first-child{margin-top:0}
.ai-box ul{margin:4px 0 8px;padding-left:20px} .ai-box p{margin:3px 0}
.ai-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--purple);margin-bottom:6px}
.btn.ai{background:linear-gradient(135deg,#8A55D6,#E0508A);border-color:transparent;color:#fff}
.btn.ai:hover{filter:brightness(1.05)}
.sec-title .btn{margin-left:auto}
.person-ai{margin:-4px 0 14px}
.sent-chip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--teal-soft);color:#0E7466;align-self:center}
.rep-sec{font-weight:700;font-size:14.5px;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.rep-sec .n{width:20px;height:20px;border-radius:50%;background:var(--blue);color:#fff;font-size:12px;display:inline-grid;place-items:center}
.range-row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:16px}
.range-row .field{min-width:150px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
.spin.dark{border-color:var(--purple-line);border-top-color:var(--purple)}
@keyframes sp{to{transform:rotate(360deg)}}
.tbl-wrap{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:6px}
table.ppl{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
table.ppl th{background:var(--gray-soft);color:var(--muted);font-weight:600;text-align:left;padding:9px 12px;white-space:nowrap}
table.ppl td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
table.ppl td.nm{display:flex;align-items:center;gap:8px;font-weight:600}
table.ppl .acts2{display:flex;gap:6px;justify-content:flex-end}
.muted{color:var(--faint)}
.imp-box{border:1px dashed var(--purple-line);background:var(--purple-soft);border-radius:6px;padding:16px 18px;margin-top:16px}
.imp-box h3{margin:0 0 6px;font-size:15.5px;color:var(--purple-ink)}
.imp-box p{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.imp-box code{background:#fff;border-radius:3px;padding:1px 6px;font-size:12.5px;color:var(--ink)}
.imp-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.errlist{background:var(--pink-soft);color:#A2275C;border-radius:4px;padding:10px 12px;font-size:13.5px;max-height:180px;overflow:auto;margin-bottom:12px}
.oklist{background:var(--teal-soft);color:#0E6F63;border-radius:4px;padding:10px 12px;font-size:14px;margin-bottom:12px;font-weight:600}
.prev{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:4px}
.prev table{border-collapse:collapse;font-size:13px;width:100%}
.prev th{position:sticky;top:0;background:var(--gray-soft);color:var(--muted);text-align:left;padding:6px 8px;white-space:nowrap}
.prev td{padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.prev tr.bad td{background:var(--pink-soft)}
.login-wrap{min-height:calc(100vh - 60px);display:grid;place-items:center;padding:24px 16px}
.login{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(45,91,227,.12)}
.login .rainbow{height:6px}
.login-in{padding:30px 30px 28px}
.login .brand{margin-bottom:6px}
.login .lead{color:var(--muted);font-size:14px;margin:0 0 22px}
.login .field+.field{margin-top:16px}
.login .btn{width:100%;justify-content:center;margin-top:22px;padding:11px 16px;font-size:15.5px}
.login .err{margin-top:14px;background:var(--pink-soft);color:#B32F66;border-radius:4px;padding:9px 12px;font-size:14px}
.login .hint{margin-top:16px;font-size:13px;color:var(--muted);background:var(--purple-soft);border-radius:4px;padding:9px 12px}
.out{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.out:hover{border-color:#E0508A;color:#C23A72}
.who-row{display:flex;align-items:center;gap:8px}
.who{cursor:default}

@media (max-width:860px){
  .topbar-in{padding:14px 16px 0}
  .tab{padding:10px 14px;font-size:14.5px}
  .tab svg{width:17px;height:17px}
  .tab .badge{display:none}
  .wrap{grid-template-columns:minmax(0,1fr);padding:18px 16px 50px;gap:18px}
  .side h4{margin:14px 0 9px}
  .panel{padding:20px 16px}
  .form-grid{grid-template-columns:minmax(0,1fr)}

  .ringbox{flex-direction:column;align-items:flex-start}
  .toast{right:16px;bottom:16px}
}

<script>
/* 獨立的錯誤提示：主程式出錯時顯示原因，不要一直停在「載入中」 */
window.__appStarted=false;
window.addEventListener('error',function(e){
  var a=document.getElementById('app');
  if(a) a.innerHTML='<div class="loading">網頁發生錯誤：'+String(e.message||e).replace(/</g,'&lt;')+(e.lineno?'（第 '+e.lineno+' 行）':'')+'<br>請截圖給系統管理者</div>';
});
setTimeout(function(){
  if(!window.__appStarted){
    var a=document.getElementById('app');
    if(a && /載入中/.test(a.textContent)) a.innerHTML='<div class="loading">主程式沒有啟動（可能是程式碼貼上不完整）。<br>請確認 Index.html 有完整貼上，最後一行是 &lt;/html&gt;。</div>';
  }
},8000);
</script>
<script>
(function(){
'use strict';
window.__appStarted=true;
/* ═════════ 基本設定 ═════════ */
const STATUSES = ['未開始','進行中','等待外部','暫停','待確認','完成'];
const ST_CLASS = {'未開始':'todo','進行中':'doing','等待外部':'wait','暫停':'pause','待確認':'review','完成':'done'};
const PROJ_COLORS = ['#2D5BE3','#8A55D6','#E0791F','#2B9BD8','#C2399A','#4C9A2A','#5B5FC7','#D0533C','#0E8AA0','#9C6B30'];
const TEMP_COLOR = '#E0508A';
const PERSON_COLORS = ['#8A55D6','#2D5BE3','#E0508A','#14917F','#E0791F','#2B9BD8','#C2399A','#4C9A2A'];
const SEG = [['done','完成','#14917F'],['review','待確認','#C98A00'],['active','執行中','#2D5BE3'],['todo','未開始','#D5D5DF']];
const IS_DEMO = !(window.google && google.script && google.script.run);
const S = {
  people:[], projects:[], tasks:[], config:{salutation:'今日工作進度報告如下：',title:'每日工作追蹤'}, today:'', af:{q:'',status:'未完成'},
  me:null, token:null, admin:null, sets:null, isSuper:false, aiEnabled:false, reportedToday:false, aiPerson:{}, aiRange:null, tab:'mine', modal:null, login:{account:'',password:'',err:''},
  f:{type:'全部', status:'未完成', who:'全部', src:'全部', q:''},
  sf:{period:'全部', src:'全部'},
  form:{type:'專案執行', project:'', content:'', assignee:'', due:'', link:'', notify:true}
};
const ICON = {
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg>',
  table:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="1.5"/><path d="M3 9.5h18M3 15h18M9 4v16M15 4v16"/></svg>',
  team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>',

  search:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',
  spark:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M11 2h2v7.6l5.4-5.4 1.4 1.4L14.4 11H22v2h-7.6l5.4 5.4-1.4 1.4-5.4-5.4V22h-2v-7.6l-5.4 5.4-1.4-1.4L9.6 13H2v-2h7.6L4.2 5.6l1.4-1.4L11 9.6z"/></svg>',
  type:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18 9 9l4 6 3-4 4 7z"/><path d="M4 6h16"/></svg>',
  status:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M18 4l2 2-2 2"/></svg>',
  src:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>'
};

/* ═════════ 工具 ═════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseT(s){ if(!s) return null; const d=new Date(String(s).split('/').join('-').replace(' ','T')); return isNaN(d)?null:d; }
function dOnly(s){ const d=parseT(String(s).slice(0,10)+'T00:00'); return d?d.getTime():NaN; }
function dayDiff(a,b){ return Math.round((dOnly(b)-dOnly(a))/864e5); }
function md(s){ if(!s) return '—'; const p=String(s).slice(5,10).split('-'); return (+p[0])+'/'+(+p[1]); }
function elapsed(from,to){
  const a=parseT(from); if(!a) return '';
  const b=to?parseT(to):new Date(); const ms=Math.max(0,b-a);
  const m=Math.floor(ms/6e4); if(m<60) return m+' 分鐘';
  const h=Math.floor(m/60); if(h<24) return h+' 小時';
  return Math.floor(h/24)+' 天';
}
const hasProg = t => t.progress!=='' && t.progress!=null && !isNaN(t.progress);
const isOverdue = t => t.status!=='完成' && t.status!=='待確認' && !!t.due && String(t.due).slice(0,10) < S.today;
const me = () => S.people.find(p=>p.name===S.me);
const isMgr = name => { const p=S.people.find(p=>p.name===name); return !!p && p.role==='主管'; };
const managers = () => S.people.filter(p=>p.role==='主管');
function store(k,v){ try{ v==null?localStorage.removeItem(k):localStorage.setItem(k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }

let projMap={};
function buildColorMap(){
  projMap={};
  const names=[...new Set([...S.projects,...S.tasks.map(t=>t.project)].filter(Boolean))].sort();
  names.forEach((n,i)=>projMap[n]=PROJ_COLORS[i%PROJ_COLORS.length]);
}
const projColor = t => !t.project ? TEMP_COLOR : (projMap[t.project]||PROJ_COLORS[0]);
const projColorByName = n => projMap[n]||PROJ_COLORS[0];
function personColor(name){ const i=S.people.findIndex(p=>p.name===name); return PERSON_COLORS[(i<0?0:i)%PERSON_COLORS.length]; }
const avatar = name => `<span class="av" style="background:${personColor(name)}">${esc(String(name||'?').slice(0,1))}</span>`;

function api(fn,...args){
  if(IS_DEMO && fn!=='api_login' && fn!=='api_logout') args[0]=Demo.auth(args[0]);
  if(!IS_DEMO) return new Promise((res,rej)=>{
    const slow=/^api_(ai|testAi|sendDailyReport|import)/.test(fn);
    const timer=setTimeout(()=>rej(new Error(slow?'AI 處理時間過長，請稍後再試一次':'伺服器沒有回應，請重新整理再試一次')),slow?120000:30000);
    google.script.run.withSuccessHandler(r=>{clearTimeout(timer);res(r);}).withFailureHandler(e=>{clearTimeout(timer);rej(e);})[fn](...args);
  });
  try{ return Promise.resolve(JSON.parse(JSON.stringify(Demo[fn](...args)))); }catch(e){ return Promise.reject(e); }
}
function run(fn,args,okMsg){
  document.body.classList.add('busy');
  return api(fn,S.token,...args).then(res=>{
    document.body.classList.remove('busy');
    applyData(res); S.modal=null; render(); if(okMsg) toast(okMsg);
  }).catch(err=>{ document.body.classList.remove('busy'); onErr(err); });
}
function errMsg(err){ return String((err&&err.message)||err||'').replace(/^(Uncaught\s+)?(Exception|Error|TypeError)\s*[:：]\s*/,''); }
function onErr(err){
  const msg=errMsg(err);
  if(/重新登入/.test(msg)){ logoutLocal(); S.login.err=msg; render(); return; }
  toast(msg,true);
}
function logoutLocal(){ S.token=null; S.me=null; S.tasks=[]; S.modal=null; S.tab='mine'; store('dtt.token',null); }
function applyData(res){ S.isSuper=!!res.isSuper; S.aiEnabled=!!res.aiEnabled; S.reportedToday=!!res.reportedToday; S.me=res.me||null; S.people=res.people; S.projects=res.projects||[]; S.tasks=res.tasks; S.config=res.config; S.today=res.today; buildColorMap(); }
let toastTimer;
function toast(msg,err){
  const el=$('#toast'); el.innerHTML=`<div class="toast ${err?'err':''}">${esc(msg)}</div>`;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.innerHTML='',err?4500:2400);
}

/* ═════════ 回報文字（與後端同格式） ═════════ */
function orderTasks(list){
  const key=t=>t.project?t.project:'\uffff';
  const first={};
  list.forEach(t=>{ const k=key(t), tm=(parseT(t.assignedAt)||0)*1; if(first[k]===undefined||tm<first[k]) first[k]=tm; });
  return list.slice().sort((a,b)=>{
    const ka=key(a), kb=key(b);
    if(ka!==kb){ if(ka==='\uffff') return 1; if(kb==='\uffff') return -1; return (first[ka]-first[kb])||(ka<kb?-1:1); }
    return (parseT(a.assignedAt)||0)-(parseT(b.assignedAt)||0);
  });
}
function reportLine(t){
  let s=(t.project?t.project+'，':'')+t.content;
  if(hasProg(t)) s+='('+t.progress+'%)';
  if(t.latest) s+='；'+String(t.latest).replace(/\s*\n+\s*/g,'，');
  s=s.replace(/[。．.]+$/,'');
  const tags=[];
  if(t.status==='完成') tags.push('已完成');
  else if(t.status==='待確認') tags.push('已完成，待主管確認');
  else if(t.status==='等待外部') tags.push('等待外部'+(t.waitingFor?'：'+t.waitingFor:''));
  else if(t.status==='暫停') tags.push('暫停');
  if(isOverdue(t)) tags.push('逾期');
  if(tags.length) s+='（'+tags.join('，')+'）';
  return s+'。';
}
function buildReportText(list){
  const lines=[S.config.salutation||'今日工作進度報告如下：',''];
  orderTasks(list).forEach((t,i)=>{ lines.push((i+1)+'.'+reportLine(t)); if(t.link) lines.push(t.link); });
  return lines.join('\n');
}

/* ═════════ 畫面 ═════════ */
function render(){
  if(!S.me){ $('#app').innerHTML = loginHtml(); $('#modal').innerHTML=''; const f=$('#lgAcc'); if(f&&!S.login.account) f.focus(); return; }
  const mgr=isMgr(S.me);
  if(!mgr && S.tab!=='mine') S.tab='mine';
  let body;
  if(S.tab==='assign') body=`<div class="wrap single"><main id="main">${assignHtml()}</main></div>`;
  else if(S.tab==='stats') body=`<div class="wrap single"><main id="main">${statsPage()}</main></div>`;
  else if(S.tab==='settings') body=`<div class="wrap single"><main id="main">${settingsPage()}</main></div>`;
  else if(S.tab==='people') body=`<div class="wrap single"><main id="main">${peoplePage()}</main></div>`;
  else body=`<div class="wrap"><aside class="side">${sideHtml()}</aside><main id="main">${mainHtml()}</main></div>`;
  $('#app').innerHTML = topHtml(true)+body;
  renderModal();
}

function loginHtml(){
  const L=S.login;
  return `${IS_DEMO?'<div class="demo">預覽模式：使用示範資料，重新整理就會還原。</div>':''}
  <div class="login-wrap"><form class="login" data-form="login" autocomplete="on">
    <div class="rainbow"></div>
    <div class="login-in">
      <div class="brand"><span class="mark">${ICON.spark}</span>${esc(S.config.title)}</div>
      <p class="lead">請輸入帳號密碼登入</p>
      <div class="field"><label for="lgAcc">帳號</label><input class="inp" id="lgAcc" name="username" autocomplete="username" data-bind="login.account" value="${esc(L.account)}"></div>
      <div class="field"><label for="lgPw">密碼</label><input class="inp" id="lgPw" name="password" type="password" autocomplete="current-password" data-bind="login.password" value="${esc(L.password)}"></div>
      <button class="btn primary" type="submit">登入</button>
      ${L.err?`<div class="err">${esc(L.err)}</div>`:''}
      ${IS_DEMO?'<div class="hint">預覽帳號：主管 n821129x / n821129x；員工 demo / demo</div>':''}
    </div></form></div>`;
}
function doLogin(){
  const L=S.login;
  if(!L.account.trim()||!L.password){ L.err='請輸入帳號與密碼'; render(); return; }
  document.body.classList.add('busy');
  api('api_login',L.account.trim(),L.password).then(res=>{
    document.body.classList.remove('busy');
    S.token=res.token; store('dtt.token',res.token);
    S.login={account:'',password:'',err:''}; S.tab='mine';
    applyData(res.data); render();
  }).catch(err=>{ document.body.classList.remove('busy'); L.password=''; L.err=errMsg(err); render(); });
}
document.addEventListener('submit',e=>{ if(e.target.dataset.form==='login'){ e.preventDefault(); doLogin(); } });

function topHtml(withTabs){
  const p=me(); const mgr=p&&p.role==='主管';
  const tab=(v,ic,cls,label,extra)=>`<button class="tab ${S.tab===v?'on':''} ${v==='assign'?'accent':''}" data-act="tab" data-v="${v}"><span class="ic ${cls}">${ic}</span>${label}${extra||''}</button>`;
  const tabs = withTabs ? `<nav class="tabs">
      ${tab('mine',ICON.grid,'','我的工作')}
      ${mgr?tab('assign',ICON.table,'p','指派工作',' <span class="badge">主管</span>')+tab('team',ICON.team,'k','團隊總覽')+tab('stats',ICON.chart,'t','統計圖表')+tab('people',ICON.user,'p','人員管理')+(S.isSuper?tab('settings',ICON.gear,'','系統設定'):''):''}
    </nav>` : '<div style="height:18px"></div>';
  return `${IS_DEMO?'<div class="demo">預覽模式：使用示範資料，重新整理就會還原。部署到 Apps Script 後才會寫入試算表與寄信。</div>':''}
  <div class="rainbow"></div>
  <header class="topbar"><div class="topbar-in">
    <div class="brand-row">
      <div class="brand"><span class="mark">${ICON.spark}</span>${esc(S.config.title)}</div>
      ${p?`<div class="who-row"><span class="who">${avatar(p.name)}<span>${esc(p.name)}</span><span class="role ${mgr?'mgr':''}">${p.role}</span></span><button class="out" data-act="logout">登出</button></div>`:''}
    </div>${tabs}
  </div></header>`;
}

function baseList(){
  let list=S.tasks;
  if(S.tab==='mine') list=list.filter(t=>t.assignee===S.me);
  if(S.tab==='team' && S.f.who!=='全部') list=list.filter(t=>t.assignee===S.f.who);
  if(S.f.type!=='全部') list=list.filter(t=>t.type===S.f.type);
  if(S.f.src!=='全部') list=list.filter(t=>t.source===S.f.src);
  return list;
}
function matchStatus(t,s){
  if(s==='全部') return true;
  if(s==='未完成') return t.status!=='完成';
  if(s==='逾期') return isOverdue(t);
  if(s==='近7天完成') return t.status==='完成' && !!t.doneAt && dayDiff(t.doneAt,S.today)<7;
  return t.status===s;
}
const F_DEFAULT={type:'全部',status:'未完成',who:'全部',src:'全部',q:''};
/* 篩選提示條：有任何非預設條件時顯示 */
function filterNote(shown){
  const f=S.f, chips=[];
  if(f.status!==F_DEFAULT.status) chips.push('狀態：'+f.status);
  if(f.type!=='全部') chips.push('類型：'+f.type);
  if(f.src!=='全部') chips.push('來源：'+f.src);
  if(S.tab==='team'&&f.who!=='全部') chips.push('承辦人：'+f.who);
  if(f.q.trim()) chips.push('搜尋：「'+f.q.trim()+'」');
  if(!chips.length) return '';

function cardActions(t,view){
  const mine=t.assignee===S.me, mgr=isMgr(S.me), acts=[];
  if(t.status==='完成') return acts;
  if(mgr){
    if(t.status==='待確認'){
      acts.push(`<button class="btn sm teal" data-act="confirm" data-id="${t.id}">✓ 確認完成</button>`);
      acts.push(`<button class="btn sm pink" data-act="reject" data-id="${t.id}">退回</button>`);
    } else {
      if(mine && t.status==='未開始') acts.push(`<button class="btn sm primary" data-act="start" data-id="${t.id}">▶ 開始</button>`);
      acts.push(`<button class="btn sm" data-act="report" data-id="${t.id}">回報</button>`);
      acts.push(`<button class="btn sm teal" data-act="mgrDone" data-id="${t.id}">完成</button>`);
    }
    if(view!=='mine') acts.push(`<button class="btn sm purple" data-act="reassign" data-id="${t.id}">轉派</button>`);
    return acts;
  }
  if(!mine) return acts;
  if(t.status==='待確認') return [`<span class="wait-note">已提報，等待主管確認</span>`];
  if(t.status==='未開始') acts.push(`<button class="btn sm primary" data-act="start" data-id="${t.id}">▶ 開始</button>`);
  acts.push(`<button class="btn sm" data-act="report" data-id="${t.id}">回報</button>`);
  acts.push(`<button class="btn sm amber" data-act="submit" data-id="${t.id}">提報完成</button>`);
  return acts;
}

function cardHtml(t,view){
  const od=isOverdue(t), prog=hasProg(t), cls=ST_CLASS[t.status]||'todo', pc=projColor(t);
  let big, bigCls=od?'od':cls;
  if(prog) big=t.progress+'%';
  else if(t.status==='完成') big='完成';
  else if(t.status==='待確認') big='待確認';
  else if(t.status==='未開始') big='待開始';
  else big=elapsed(t.startedAt)||'—';
  let runTxt;
  if(t.status==='未開始') runTxt='指派 '+elapsed(t.assignedAt);
  else if(t.status==='完成') runTxt='用時 '+(elapsed(t.startedAt||t.assignedAt,t.submittedAt||t.doneAt)||'—');
  else if(t.status==='待確認') runTxt='用時 '+(elapsed(t.startedAt||t.assignedAt,t.submittedAt)||'—');
  else runTxt='已進行 '+elapsed(t.startedAt);
  let remain='';
  if(t.status==='完成') remain=md(t.doneAt)+' 完成';
  else if(t.status==='待確認') remain=md(t.submittedAt)+' 提報';
  else if(t.due){ const d=dayDiff(S.today,t.due); remain = d>0?'剩 '+d+' 天':(d===0?'今天到期':`<span class="od">逾期 ${-d} 天</span>`); }
  const a=dOnly(t.assignedAt), e=dOnly(t.due)+864e5;
  const endT=(t.status==='完成'||t.status==='待確認')?((parseT(t.submittedAt||t.doneAt)||new Date()).getTime()):Date.now();
  const tp = e>a ? Math.max(3,Math.min(100,(endT-a)/(e-a)*100)) : 100;
  const acts=cardActions(t,view);
  const done=t.status==='完成'||t.status==='待確認';
  return `<article class="card" data-act="detail" data-id="${t.id}" style="--pc:${pc};--pct:${hexA(pc,.07)}">
    <div class="viz">
      <div class="viz-top"><span class="big ${bigCls}">${esc(big)}</span>
        <span class="chips"><span class="chip st-${cls}">${t.status}</span>${od?'<span class="chip st-od">逾期</span>':''}</span></div>
      ${prog?`<div class="bar ${done?'done':''}"><i style="width:${t.progress}%"></i></div>`:''}
      <div class="tbar ${od?'od':''} ${done?'done':''}" title="期限時間消耗"><i style="width:${tp}%"></i></div>
      <div class="viz-sub"><span>${esc(runTxt)}</span><span>${remain}</span></div>
    </div>
    <div class="body">
      <div class="tags"><span class="ptag" style="background:${hexA(pc,.12)};color:${pc}">${t.project?esc(t.project):'臨時代辦'}</span>${t.source==='自行新增'?'<span class="stag">自行新增</span>':''}</div>
      <div class="content">${esc(t.content)}</div>
      ${t.latest?`<div class="latest">${esc(t.latest)}${t.status==='等待外部'&&t.waitingFor?'（等待：'+esc(t.waitingFor)+'）':''}</div>`:(t.status==='等待外部'&&t.waitingFor?`<div class="latest">等待：${esc(t.waitingFor)}</div>`:'')}
      <div class="meta">${view!=='mine'?avatar(t.assignee)+esc(t.assignee)+' ·':''} #${t.id} · 期限 ${md(t.due)}</div>
    </div>
    ${acts.length?`<div class="acts">${acts.join('')}</div>`:''}
  </article>`;
}

  tasks:{label:'工作',cols:[
    ['type','類型',['類型','工作類型']],['project','專案名稱',['專案名稱','專案','案名','案件']],['content','工作內容',['工作內容','代辦內容','待辦內容','內容','工作項目','事項']],
    ['assignee','承辦人',['承辦人','負責人員','員工','執行人']],['due','需完成日期',['需完成日期','完成日期','期限','到期日','截止日']],
    ['link','連結',['連結','網址','link']],['status','狀態',['狀態']],['progress','進度',['進度','完成度']],
    ['latest','最新回報',['最新回報','回報內容','回報','備註']],['waitingFor','等待對象',['等待對象','等待']]],
    required:['content','assignee','due'],
    sample:[['專案執行','北市圖資案','追蹤圖資轉檔進度','晏晨','2026/11/10','','等待外部','','叡揚報價單尚未提供','叡揚'],
            ['臨時代辦','','彙整本週各圖資案作業進度','晏晨','115/11/07','','','','','']]}
};
function xlsxReady(){ if(window.XLSX) return true; toast('Excel 元件載入失敗，請重新整理後再試',true); return false; }
function downloadTemplate(kind){
  if(!xlsxReady()) return;
  const spec=IMPORT_SPEC[kind];
  const ws=XLSX.utils.aoa_to_sheet([spec.cols.map(c=>c[1]),...spec.sample]);
  ws['!cols']=spec.cols.map(c=>({wch:c[0]==='content'?36:14}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,spec.label);
  try{ XLSX.writeFile(wb,spec.label+'匯入範本.xlsx'); }
  catch(e){ toast('瀏覽器不允許下載，請自行建立 Excel，第一列放欄位名稱',true); }
}
function pad2(n){ return String(n).padStart(2,'0'); }
function normDate(v){
  if(v===''||v==null) return '';
  if(typeof v==='number'){ const d=new Date(Math.round((v-25569)*864e5)); return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
  if(v instanceof Date) return v.getFullYear()+'-'+pad2(v.getMonth()+1)+'-'+pad2(v.getDate());
  const nums=String(v).match(/\d+/g)||[];
  let y,m,d;
  if(nums.length>=3){ y=+nums[0]; m=+nums[1]; d=+nums[2]; }
  else if(nums.length===2){ y=+S.today.slice(0,4); m=+nums[0]; d=+nums[1]; }
  else return '';
  if(y<1911) y+=1911;
  if(m<1||m>12||d<1||d>31) return '';
  return y+'-'+pad2(m)+'-'+pad2(d);
}
function parseSheet(kind,buf){
  const spec=IMPORT_SPEC[kind];
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  const norm=x=>String(x).replace(/\s+/g,'').toLowerCase();
  let hIdx=-1, map=null;
  for(let i=0;i<Math.min(aoa.length,10);i++){
    const hdr=aoa[i].map(norm), m={};
    spec.cols.forEach(c=>{ const j=hdr.findIndex(h=>c[2].map(norm).includes(h)); if(j>=0) m[c[0]]=j; });
    if(spec.required.every(k=>k in m)){ hIdx=i; map=m; break; }
  }
  if(hIdx<0) throw new Error('找不到欄位名稱列，必要欄位：'+spec.required.map(k=>spec.cols.find(c=>c[0]===k)[1]).join('、'));
  const rows=[];
  for(let i=hIdx+1;i<aoa.length;i++){
    const r=aoa[i]; if(!r.some(x=>String(x).trim()!=='')) continue;
    const o={_row:i+1};
    spec.cols.forEach(c=>{ if(c[0] in map){ let v=r[map[c[0]]]; o[c[0]]=v==null?'':v; } });
    Object.keys(o).forEach(k=>{ if(k!=='_row'&&typeof o[k]==='string') o[k]=o[k].trim(); });
    if(kind==='tasks'){
      o.due=normDate(o.due);
      if(o.progress!==''&&o.progress!=null){ const n=parseFloat(String(o.progress).replace('%','')); o.progress=isNaN(n)?'':(n>0&&n<1&&String(o.progress).indexOf('%')<0?Math.round(n*100):Math.max(0,Math.min(100,Math.round(n)))); }
      o.type=/臨時/.test(String(o.type||''))?'臨時代辦':'專案執行';
    } else {
      o.role=/主管|管理/.test(String(o.role||''))?'主管':'員工';
      if(o.password!=null) o.password=String(o.password);
      if(o.account!=null) o.account=String(o.account);
    }
    o._err=checkRow(kind,o);
    rows.push(o);
  }
  return rows;
}
function checkRow(kind,o){
  const e=[];
  if(kind==='tasks'){
    if(!o.content) e.push('工作內容空白');
    if(!o.assignee) e.push('承辦人空白');
    else if(!S.people.some(p=>p.name===String(o.assignee))) e.push('人員表沒有「'+o.assignee+'」');
    if(!o.due) e.push('日期無法辨識');
  } else {
    if(!o.name) e.push('姓名空白');
    if(o.account && !o.password && !(S.admin||[]).some(p=>p.name===o.name&&p.hasPassword)) e.push('有帳號但沒有密碼');
  }
  return e.join('、');
}

}

function mdHtml(text){
  const out=[]; let inList=false;
  const inl=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  String(text||'').split('\n').forEach(raw=>{
    const line=raw.trim();
    const li=line.match(/^[-*•]\s+(.*)$/)||line.match(/^\d+[.)、]\s+(.*)$/);
    if(li){ if(!inList){ out.push('<ul>'); inList=true; } out.push('<li>'+inl(li[1])+'</li>'); return; }
    if(inList){ out.push('</ul>'); inList=false; }
    if(!line) return;
    const h=line.match(/^#{1,4}\s+(.*)$/);
    out.push(h?'<h4>'+inl(h[1])+'</h4>':'<p>'+inl(line)+'</p>');
  });
  if(inList) out.push('</ul>');
  return out.join('');
}

const QUICK=['本週','上週','本月','近 30 天'];
function quickRange(k){
  const t=S.today, dow=(new Date(t+'T00:00').getDay()+6)%7, mon=addDays(t,-dow);
  if(k==='本週') return [mon,t];
  if(k==='上週') return [addDays(mon,-7),addDays(mon,-1)];
  if(k==='本月') return [t.slice(0,8)+'01',t];
  return [addDays(t,-29),t];
}
function mdw(day){ const d=new Date(day+'T00:00'); return (d.getMonth()+1)+'/'+d.getDate()+'（'+'日一二三四五六'[d.getDay()]+'）'; }
function addDays(day,n){ const d=new Date(day+'T00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function copyText(txt,msg){

  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok));
  else fallbackCopy(txt,ok);
}
function fallbackCopy(txt,ok){ const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); ok(); }

function bucket(t){ if(t.status==='完成') return 'done'; if(t.status==='待確認') return 'review'; if(t.status==='未開始') return 'todo'; return 'active'; }
function agg(list){
  const a={total:list.length,done:0,review:0,active:0,todo:0,od:0};
  list.forEach(t=>{ a[bucket(t)]++; if(isOverdue(t)) a.od++; });
  a.rate=a.total?Math.round(a.done/a.total*100):0;
  return a;
}
function inPeriod(t){
  const p=S.sf.period;
  if(p==='全部') return true;
  if(!t.assignedAt) return false;
  if(p==='本週'){ const d=t.assignedAt.slice(0,10); return d>=quickRange('本週')[0] && d<=S.today; }
  if(p==='本月') return t.assignedAt.slice(0,7)===S.today.slice(0,7);
  if(p==='近 30 天') return dayDiff(t.assignedAt,S.today)<=30;
  return true;
}
function ring(a,color){
  const r=52, C=2*Math.PI*r, gap=a.done&&a.review?3:0;
  const d=a.total?a.done/a.total:0, rv=a.total?a.review/a.total:0;
  const arc=(len,off,col,tip)=>len>0?`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${col}" stroke-width="16" stroke-dasharray="${Math.max(0,len)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)" data-tip="${tip}"/>`:'';
  return `<svg class="ring" viewBox="0 0 140 140" role="img" aria-label="完成度 ${a.rate}%">
    <circle cx="70" cy="70" r="${r}" fill="none" stroke="#EDEDF2" stroke-width="16"/>
    ${arc(C*d-gap,0,'#14917F','完成 '+a.done+' 件')}
    ${arc(C*rv-gap,C*d,'#C98A00','待確認 '+a.review+' 件')}
    <text x="70" y="72" text-anchor="middle" class="n">${a.rate}%</text>
    <text x="70" y="93" text-anchor="middle" class="s">完成度</text></svg>`;
}

    <div class="d-head"><div><h3>${title}</h3>${sub?`<div class="sub">${sub}</div>`:''}</div><button class="x" data-act="closeModal">×</button></div>
    <div class="d-body">${body}</div>${foot?`<div class="d-foot">${foot}</div>`:''}</div></div>`;
  const sub=t?esc((t.project?t.project+'｜':'')+t.content):'';
  const cancel=`<button class="btn" data-act="closeModal">取消</button>`;
  let html='';
  if(m.kind==='add'){
    const mgrs=managers();
    html=shell('新增工作','新增給自己，主管會在團隊總覽看到',`<div class="form-grid">
      <div class="field full"><label>類型</label><div class="pills">${['專案執行','臨時代辦'].map(v=>`<button class="pill ${m.type===v?'on':''}" data-act="addType" data-v="${v}"><span class="dot" style="background:${v==='臨時代辦'?TEMP_COLOR:'#2D5BE3'}"></span>${v}</button>`).join('')}</div></div>
      <div class="field full"><label>專案名稱${m.type==='臨時代辦'?'<span class="opt">可留空</span>':''}</label><input class="inp" list="projList" data-bind="m.project" value="${esc(m.project)}" placeholder="例：北市圖資案">${projDatalist()}</div>
      <div class="field full"><label>工作內容</label><textarea class="inp" data-bind="m.content">${esc(m.content)}</textarea></div>
      <div class="field"><label>需完成日期</label><input class="inp" type="date" data-bind="m.due" value="${esc(m.due)}" min="${S.today}"></div>
      ${!isMgr(S.me)&&mgrs.length>1?`<div class="field"><label>回報主管</label><select class="inp" data-bind="m.owner">${mgrs.map(p=>`<option ${m.owner===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`
        :`<div class="field"><label>相關連結<span class="opt">選填</span></label><input class="inp" data-bind="m.link" value="${esc(m.link)}" placeholder="https:\/\/"></div>`}
      </div>`, cancel+`<button class="btn primary" data-act="submitAdd">新增</button>`);
  }
  else if(m.kind==='report'){
    html=shell('回報進度',sub,`
      <div class="field"><label>狀態</label><div class="pills">${['進行中','等待外部','暫停'].map(s=>`<button class="pill ${m.status===s?'on':''}" data-act="repStatus" data-v="${s}"><span class="dot" style="background:${STATUS_DOT[s]}"></span>${s}</button>`).join('')}</div></div>
      ${m.status==='等待外部'?`<div class="field" style="margin-top:16px"><label>等待對象</label><input class="inp" data-bind="m.waitingFor" value="${esc(m.waitingFor)}" placeholder="例：叡揚、住都中心"></div>`:''}
      <div class="field" style="margin-top:16px"><label class="check" style="color:var(--ink);font-weight:600"><input type="checkbox" data-bind="m.useProg" ${m.useProg?'checked':''}> 填寫進度 %<span class="opt" style="font-weight:400;color:var(--faint);margin-left:4px">沒有明確進度可不填</span></label>
        ${m.useProg?`<div class="prog-row" style="margin-top:8px"><input type="range" min="0" max="100" step="5" data-bind="m.progress" value="${m.progress===''?0:m.progress}"><span class="prog-val" id="progVal">${m.progress===''?0:m.progress}%</span></div>`:''}</div>
      <div class="field" style="margin-top:16px"><label>回報內容</label><textarea class="inp" data-bind="m.content" placeholder="例：叡揚報價單尚未提供，持續追蹤">${esc(m.content)}</textarea></div>`,
      cancel+`<button class="btn primary" data-act="submitReport">送出回報</button>`);
  }
  else if(m.kind==='finish'){
    const cfg={
      submit:['提報完成','送出後由主管確認才算完成','完成說明','例：契約已寄出並通知羅副總','btn amber','送主管確認'],
      confirm:['確認完成','承辦人：'+(t?t.assignee:''),'確認說明','選填','btn teal','✓ 確認完成'],
      direct:['直接標記完成','承辦人：'+(t?t.assignee:''),'完成說明','選填','btn teal','標記完成'],
      reject:['退回','工作會回到「進行中」，並通知承辦人','退回原因','例：會議紀錄缺第三案討論內容','btn pink','退回']
    }[m.mode];
    html=shell(cfg[0],sub+'<br>'+esc(cfg[1]),`${t&&t.latest&&m.mode!=='submit'?`<div class="note">承辦人最新回報：${esc(t.latest)}</div>`:''}
      <div class="field"><label>${cfg[2]}${m.mode==='reject'?'':'<span class="opt">選填</span>'}</label>
      <textarea class="inp" data-bind="m.content" placeholder="${esc(cfg[3])}">${esc(m.content)}</textarea></div>`,
      cancel+`<button class="${cfg[4]}" data-act="submitFinish">${cfg[5]}</button>`);  }
  else if(m.kind==='reassign'){
    html=shell('轉派工作',sub,`<div class="field"><label>新的承辦人</label><select class="inp" data-bind="m.to">
      ${S.people.map(p=>`<option ${m.to===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`,
      cancel+`<button class="btn primary" data-act="submitReassign">轉派並通知</button>`);
  }
  else if(m.kind==='import'){
    const n=m.rows.filter(r=>!r._err).length;
    html=shell('匯入'+IMPORT_SPEC[m.what].label+'（預覽）','確認內容後再匯入',importModalBody(m),
      cancel+`<button class="btn primary" data-act="doImport" ${n?'':'disabled'}>匯入 ${n} 列</button>`,true);
  }
  else if(m.kind==='importResult'){
    html=shell('匯入結果','',`<div class="oklist">${esc(m.summary)}</div>${m.errors.length?`<div class="errlist">${m.errors.map(esc).join('<br>')}</div>`:''}`,
      `<button class="btn primary" data-act="closeModal">完成</button>`,true);
  }
  else if(m.kind==='person'){
    const editing=!!m.original;
    html=shell(editing?'編輯人員':'新增人員',editing?esc(m.original):'',`<div class="form-grid">
      <div class="field"><label>姓名</label><input class="inp" data-bind="m.name" value="${esc(m.name)}"></div>
      <div class="field"><label>角色</label><div class="pills">${['員工','主管'].map(r=>`<button class="pill ${m.role===r?'on':''}" data-act="personRole" data-v="${r}">${r}</button>`).join('')}</div></div>
      <div class="field"><label>Email<span class="opt">收通知信用</span></label><input class="inp" type="email" data-bind="m.email" value="${esc(m.email)}"></div>
      <div class="field"><label>LINE 名稱<span class="opt">選填</span></label><input class="inp" data-bind="m.line" value="${esc(m.line)}"></div>
      <div class="field"><label>帳號</label><input class="inp" data-bind="m.account" value="${esc(m.account)}" autocomplete="off"></div>
      <div class="field"><label>密碼${editing?'<span class="opt">留空表示不變</span>':''}</label><input class="inp" type="text" data-bind="m.password" value="${esc(m.password)}" autocomplete="off" placeholder="${editing?'輸入新密碼即可重設':'至少 4 個字'}"></div>
      </div>${editing&&m.original!==m.name?'<div class="note" style="margin-top:14px">改名後，他名下的工作會一起改成新名字。</div>':''}`,
      cancel+`<button class="btn primary" data-act="savePerson">儲存</button>`);
  }
  else if(m.kind==='delPerson'){
    html=shell('刪除人員？',esc(m.name),`<div class="note" style="background:var(--pink-soft);color:#A2275C">刪除後此人無法登入。若他還有未完成的工作，需要先轉派。</div>`,
      cancel+`<button class="btn danger" data-act="doDelPerson">確定刪除</button>`);
  }
  else if(m.kind==='delete'){
    html=shell('刪除工作？',sub,`<div class="note" style="background:var(--pink-soft);color:#A2275C">刪除後無法復原，但回報歷程會保留一筆刪除紀錄。</div>`,
      cancel+`<button class="btn danger" data-act="submitDelete">確定刪除</button>`);
  }
  else if(m.kind==='text'){
    html=shell('今日回報',S.reportedToday?'今天已寄過日報，再寄一次會寄出最新版本給主管':'可複製使用，或直接寄日報給主管',
      `<div class="rep-sec"><span class="n">1</span>回報說明<button class="btn sm" data-act="copy" style="margin-left:auto">複製</button></div>
       <textarea class="inp report-text" id="repText" data-bind="m.text" style="min-height:220px">${esc(m.text)}</textarea>
       ${isMgr(S.me)?`<div class="rep-sec"><span class="n">2</span>AI 進度摘要<span class="opt" style="font-weight:400;color:var(--faint);font-size:12.5px">可修改</span>
         ${S.aiEnabled?`<button class="btn sm ai" data-act="aiDaily" style="margin-left:auto" ${m.aiLoading?'disabled':''}>${m.aiLoading?'<span class="spin"></span> 彙整中':SPARK+' AI 彙整'}</button>`:''}</div>
       ${S.aiEnabled?`<textarea class="inp" data-bind="m.ai" style="min-height:110px" placeholder="按「AI 彙整」自動產生；留空的話寄出時會自動產生">${esc(m.ai)}</textarea>`
         :'<div class="note">尚未設定 Gemini API 金鑰，日報會只包含回報說明與工作表格。</div>'}`
       :`<div class="note" style="margin-top:14px">寄出後，主管收到的日報會附上工作明細表格${S.aiEnabled?'與系統自動產生的進度摘要':''}。請先在系統上把每件工作的進度更新好再寄出。</div>`}
       <div class="rep-sec"><span class="n">${isMgr(S.me)?3:2}</span>工作明細表格<span class="opt" style="font-weight:400;color:var(--faint);font-size:12.5px">寄出時依系統最新進度自動附上（${m.count} 件）</span></div>`,
      `<button class="btn" data-act="closeModal">關閉</button><button class="btn primary" data-act="sendReport" ${m.sending?'disabled':''}>${m.sending?'<span class="spin"></span> 寄送中…':'寄出日報給主管'}</button>`,true);
  }
  else if(m.kind==='detail' && t){
    const kv=[['編號','#'+t.id],['類型',t.type],['來源',t.source],['專案',t.project||'—'],['承辦人',t.assignee],['負責主管',t.owner||'—'],['狀態',t.status+(t.waitingFor&&t.status==='等待外部'?'（'+t.waitingFor+'）':'')],
      ['進度',hasProg(t)?t.progress+'%':'—'],['需完成日期',t.due||'—'],['指派時間',t.assignedAt||'—'],['開始時間',t.startedAt||'—'],['提報時間',t.submittedAt||'—'],['完成時間',t.doneAt||'—']];
    if(t.link) kv.push(['連結',`<a href="${esc(t.link)}" target="_blank" rel="noopener">${esc(t.link)}</a>`]);
    const hist=m.history==null?'<div style="color:var(--faint);font-size:13.5px">載入中…</div>':
      (m.history.length?m.history.map(h=>`<div class="h-item"><span class="t">${esc(h.time.slice(5))}</span><span><b>${esc(h.actor)}</b>｜${esc(h.status)}${h.progress!==''&&h.progress!=null?' '+h.progress+'%':''}${h.source&&h.source!=='網頁'?`<span class="src">${esc(h.source)}</span>`:''}${h.content?'<br>'+esc(h.content):''}</span></div>`).join(''):'<div style="color:var(--faint);font-size:13.5px">尚無紀錄</div>');
    const foot=isMgr(S.me)?`<button class="btn pink left" data-act="askDelete" data-id="${t.id}">刪除</button><button class="btn" data-act="closeModal">關閉</button>`:'';
    html=shell(esc(t.content),t.project?esc(t.project):'臨時代辦',
      `<dl class="kv">${kv.map(r=>`<dt>${r[0]}</dt><dd>${r[0]==='連結'?r[1]:esc(r[1])}</dd>`).join('')}</dl>
       ${t.latest?`<div style="margin-top:14px;background:${hexA(dc,.08)};border-left:3px solid ${dc};border-radius:4px;padding:10px 12px;font-size:14px">${esc(t.latest)}</div>`:''}
       <div class="hist"><h4>回報歷程</h4>${hist}</div>`,foot,true);
  }
  root.innerHTML=html;
}

/* ═════════ 動作 ═════════ */
const A = {
  noop(){},
  tab(el){ S.tab=el.dataset.v; if(S.tab!=='team') S.f.who='全部'; if(S.tab==='people') S.admin=null; if(S.tab==='settings') S.sets=null; render(); window.scrollTo(0,0); },
  f(el){ S.f[el.dataset.k]=el.dataset.v; render(); },
  tileF(el){ const v=el.dataset.v; S.f.status=(S.f.status===v&&v!=='未完成')?'未完成':v; render(); },
  clearF(){ S.f={...F_DEFAULT}; render(); },
  af(el){ S.af.status=el.dataset.v; render(); },
  clearAf(){ S.af={q:'',status:'未完成'}; render(); },
  sf(el){ S.sf[el.dataset.k]=el.dataset.v; render(); },
  logout(){ const tk=S.token; logoutLocal(); render(); api('api_logout',tk).catch(()=>{}); },
  closeModal(el,e){ if(e.target!==el) return; S.modal=null; renderModal(); },
  detail(el){
    const id=el.dataset.id; S.modal={kind:'detail',id,history:null}; renderModal();
    api('api_history',S.token,id).then(h=>{ if(S.modal&&S.modal.id===id){ S.modal.history=h; renderModal(); } }).catch(()=>{ if(S.modal&&S.modal.id===id){ S.modal.history=[]; renderModal(); } });
  },
  start(el){ run('api_start',[el.dataset.id],'已開始計時'); },
  report(el){
    const t=S.tasks.find(x=>x.id===el.dataset.id);
    S.modal={kind:'report',id:t.id,status:['進行中','等待外部','暫停'].includes(t.status)?t.status:'進行中',useProg:hasProg(t),progress:hasProg(t)?t.progress:'',content:'',waitingFor:t.waitingFor||''};
    renderModal();
  },
  repStatus(el){ S.modal.status=el.dataset.v; renderModal(); },
  submitReport(){
    const m=S.modal, t=S.tasks.find(x=>x.id===m.id);
    const prog=m.useProg?Number(m.progress||0):'';
    if(!m.content.trim() && m.status===t.status && (prog===''||prog===t.progress)) return toast('請填寫回報內容，或調整狀態／進度',true);
    run('api_report',[m.id,{status:m.status,progress:prog,content:m.content.trim(),waitingFor:m.waitingFor.trim()}],'已回報');
  },
  submit(el){ S.modal={kind:'finish',mode:'submit',id:el.dataset.id,content:''}; renderModal(); },
  confirm(el){ S.modal={kind:'finish',mode:'confirm',id:el.dataset.id,content:''}; renderModal(); },
  mgrDone(el){ S.modal={kind:'finish',mode:'direct',id:el.dataset.id,content:''}; renderModal(); },
  reject(el){ S.modal={kind:'finish',mode:'reject',id:el.dataset.id,content:''}; renderModal(); },
  submitFinish(){
    const m=S.modal, c=m.content.trim();
    if(m.mode==='reject'){
      if(!c) return toast('請填寫退回原因',true);
      return run('api_report',[m.id,{status:'進行中',progress:'',content:'退回：'+c}],'已退回並通知承辦人');
    }
    if(m.mode==='submit') return run('api_report',[m.id,{status:'待確認',progress:'',content:c}],'已提報，等待主管確認');
    run('api_report',[m.id,{status:'完成',progress:'',content:c}],'已確認完成');
  },
  reassign(el){ const t=S.tasks.find(x=>x.id===el.dataset.id); S.modal={kind:'reassign',id:t.id,to:t.assignee}; renderModal(); },
  submitReassign(){ run('api_reassign',[S.modal.id,S.modal.to],'已轉派'); },
  askDelete(el){ S.modal={kind:'delete',id:el.dataset.id}; renderModal(); },
  submitDelete(){ run('api_delete',[S.modal.id],'已刪除'); },
  tpl(el){ downloadTemplate(el.dataset.v); },
  pickFile(el){ if(el.dataset.v==='people'&&!S.admin){ loadAdmin().then(()=>pickFile('people')); return; } pickFile(el.dataset.v); },
  doImport(){
    const m=S.modal, rows=m.rows.filter(r=>!r._err).map(r=>{ const o={...r}; delete o._err; return o; });
    const fn=m.what==='tasks'?'api_importTasks':'api_importPeople';
    const args=m.what==='tasks'?[rows,!!m.notify]:[rows];
    const skipped=m.rows.length-rows.length;
    document.body.classList.add('busy');
    api(fn,S.token,...args).then(res=>{
      document.body.classList.remove('busy');
      applyData(res.data); if(res.people) S.admin=res.people;
      const summary=m.what==='tasks'?`已匯入 ${res.added} 件工作`:`新增 ${res.added} 人、更新 ${res.updated} 人`;
      S.modal={kind:'importResult',summary:summary+(skipped?`；預覽時已略過 ${skipped} 列`:''),errors:res.errors||[]};
      render();
    }).catch(err=>{ document.body.classList.remove('busy'); onErr(err); });
  },
  newPerson(){ S.modal={kind:'person',original:'',name:'',role:'員工',email:'',line:'',account:'',password:'',color:'#8A55D6'}; renderModal(); },
  editPerson(el){ const p=S.admin.find(x=>x.name===el.dataset.v); S.modal={kind:'person',original:p.name,name:p.name,role:p.role,email:p.email,line:p.line,account:p.account,password:'',color:'#8A55D6'}; renderModal(); },
  personRole(el){ S.modal.role=el.dataset.v; renderModal(); },
  savePerson(){
    const m=S.modal;
    if(!m.name.trim()) return toast('請填姓名',true);
    if(!m.original && m.account.trim() && !m.password) return toast('有帳號就要設定密碼',true);
    document.body.classList.add('busy');
    api('api_savePerson',S.token,{name:m.name.trim(),role:m.role,email:m.email.trim(),line:m.line.trim(),account:m.account.trim(),password:m.password},m.original)
      .then(res=>{ document.body.classList.remove('busy'); S.admin=res.people; applyData(res.data); S.modal=null; render(); toast('已儲存'); })
      .catch(err=>{ document.body.classList.remove('busy'); onErr(err); });
  },
  askDelPerson(el){ S.modal={kind:'delPerson',name:el.dataset.v,color:'#E0508A'}; renderModal(); },
  doDelPerson(){
    document.body.classList.add('busy');
    api('api_deletePerson',S.token,S.modal.name)
      .then(res=>{ document.body.classList.remove('busy'); S.admin=res.people; applyData(res.data); S.modal=null; render(); toast('已刪除'); })
      .catch(err=>{ document.body.classList.remove('busy'); onErr(err); });
  },
  addTask(){ const mg=managers(); S.modal={kind:'add',color:'#8A55D6',type:'專案執行',project:'',content:'',due:'',link:'',owner:mg[0]?mg[0].name:''}; renderModal(); },
  addType(el){ S.modal.type=el.dataset.v; renderModal(); },
  submitAdd(){
    const m=S.modal;
    if(m.type==='專案執行' && !m.project.trim()) return toast('專案執行請填專案名稱',true);
    if(!m.content.trim()) return toast('請填寫工作內容',true);
    if(!m.due) return toast('請選擇需完成日期',true);
    run('api_createTask',[{type:m.type,project:m.project,content:m.content,due:m.due,link:m.link,owner:m.owner,assignee:S.me,notify:false}],'已新增');
  },
  genReport(){
    const list=S.tasks.filter(t=>t.assignee===S.me && (t.status!=='完成' || (t.doneAt && t.doneAt.slice(0,10)===S.today)));
    if(!list.length) return toast('目前沒有工作',true);
    S.modal={kind:'text',color:'#2D5BE3',text:buildReportText(list),ai:'',count:list.length}; renderModal();
  },
  copy(){ copyText($('#repText').value,'已複製回報說明'); },
  aiDaily(){
    const m=S.modal; m.aiLoading=true; renderModal();
    api('api_aiDaily',S.token).then(txt=>{ if(S.modal===m){ m.ai=txt; m.aiLoading=false; renderModal(); } })
      .catch(err=>{ m.aiLoading=false; if(S.modal===m) renderModal(); onErr(err); });
  },
  sendReport(){
    const m=S.modal; m.sending=true; renderModal();
    api('api_sendDailyReport',S.token,m.text,m.ai).then(res=>{
      applyData(res.data); S.modal=null; render(); toast('日報已寄給 '+res.sentTo.join('、'));
    }).catch(err=>{ m.sending=false; if(S.modal===m) renderModal(); onErr(err); });
  },
  aiPerson(el){
    const n=el.dataset.v; S.aiPerson[n]={loading:true,text:(S.aiPerson[n]||{}).text||''}; render();
    api('api_aiPerson',S.token,n).then(txt=>{ S.aiPerson[n]={loading:false,text:txt}; render(); })
      .catch(err=>{ S.aiPerson[n].loading=false; render(); onErr(err); });
  },
  arQuick(el){ const r=S.aiRange, q=quickRange(el.dataset.v); r.from=q[0]; r.to=q[1]; render(); toast('已套用'+el.dataset.v+'：'+mdw(q[0])+' ～ '+mdw(q[1])); },
  aiRange(){
    const r=S.aiRange;
    if(!r.from||!r.to||r.from>r.to) return toast('請選擇正確的日期區間',true);
    r.loading=true; render();
    const key=r.from+'|'+r.to+'|'+r.who;
    api('api_aiRange',S.token,r.from,r.to,r.who).then(txt=>{ r.loading=false; r.text=txt; r.key=key; r.shownRange=mdw(r.from)+' ～ '+mdw(r.to)+(r.who?'｜'+r.who:'｜全部員工'); render(); })
      .catch(err=>{ r.loading=false; render(); onErr(err); });
  },
  copyAi(){ copyText(S.aiRange.text,'已複製分析內容'); },
  testAi(){
    const v=S.sets; if(!v.key.trim()&&!v.hasKey) return toast('請先貼上 API 金鑰',true);
    v.testing=true; v.test=null; render();
    api('api_testAi',S.token,v.key.trim(),v.model).then(txt=>{ v.testing=false; v.test={ok:true,msg:'連線成功，AI 回覆：'+txt+(v.key.trim()?'。記得按「儲存設定」。':'')}; render(); })
      .catch(err=>{ v.testing=false; v.test={ok:false,msg:errMsg(err)}; render(); });
  },
  clearKey(){

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const fn=A[el.dataset.act]; if(fn) fn(el,e);
});
function onBind(e){
  const b=e.target.dataset&&e.target.dataset.bind; if(!b) return;
  const val=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(b==='q'){ S.f.q=val; $('#main').innerHTML=mainHtml(); return; }
  if(b==='aq'){ S.af.q=val; const el=$('#assignList'); if(el) el.innerHTML=assignListHtml(); return; }
  const [scope,key]=b.split('.');
  if(scope==='login'){ S.login[key]=val; return; }
  if(scope==='ar'){ S.aiRange[key]=val; if(e.type==='change') render(); return; }
  if(scope==='st'){ S.sets[key]=val; return; }
  if(scope==='form') S.form[key]=val;
  if(scope==='m' && S.modal){
    S.modal[key]=val;
    if(key==='progress'){ const pv=$('#progVal'); if(pv) pv.textContent=val+'%'; }
    if(key==='useProg'){ if(val&&S.modal.progress==='') S.modal.progress=0; renderModal(); }
  }
}
document.addEventListener('input',onBind);
document.addEventListener('change',e=>{ if(e.target.type==='checkbox'||e.target.tagName==='SELECT'||(e.target.type==='date'&&/^ar\./.test(e.target.dataset.bind||''))) onBind(e); });
